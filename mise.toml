[tools]
rust = "stable"

[tasks.install]
description = "Build and install gigawatts, then restart the engine on the new binary"
run = [
  "cargo install --path . --locked --root \"${CARGO_HOME:-$HOME/.cargo}\"",
  "${CARGO_HOME:-$HOME/.cargo}/bin/gigawatts stop",
  "${CARGO_HOME:-$HOME/.cargo}/bin/gigawatts engine",
]

[tasks.screenshots]
description = "Redraw the README screenshots from invented demo data (macOS, needs Google Chrome)"
run = '''
set -eu
home=$(mktemp -d)
chrome="/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
cargo build --release --example demo
demo=target/release/examples/demo
"$demo" seed "$home"
"$demo" tui "$home" 190 35 "$home/terminal.html"
"$chrome" --headless=new --hide-scrollbars --force-device-scale-factor=2 --default-background-color=00000000 --window-size=1830,720 --screenshot="$PWD/docs/images/terminal.png" "file://$home/terminal.html"
"$demo" report "$home" 7979 &
server=$!
trap 'kill "$server" 2>/dev/null || true' EXIT
sleep 1
kill -0 "$server"
"$chrome" --headless=new --hide-scrollbars --force-device-scale-factor=2 --window-size=1200,885 --virtual-time-budget=8000 --screenshot="$home/report.png" http://127.0.0.1:7979/
sips -s format jpeg -s formatOptions 85 --resampleWidth 1600 "$home/report.png" --out docs/images/report.jpg
echo "demo history: $home"
'''
