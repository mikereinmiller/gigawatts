// Side panel

const panel = document.getElementById('panel');
const backdrop = document.getElementById('backdrop');
let panelOpener = null;

function panelShell(title, subtitle) {
  if (!panel.classList.contains('open')) panelOpener = document.activeElement;
  panelToken += 1;
  panel.replaceChildren();
  const head = element('div', undefined, 'panel-head');
  head.append(element('h2', title));
  const close = element('button', '✕', 'close');
  close.type = 'button';
  close.setAttribute('aria-label', 'Close');
  close.addEventListener('click', closePanel);
  head.append(close);
  panel.append(head);
  if (subtitle) panel.append(element('p', subtitle, 'note panel-sub'));
  panel.setAttribute('aria-label', title);
  panel.classList.add('open');
  panel.setAttribute('aria-hidden', 'false');
  backdrop.classList.add('open');
  close.focus();
  return panelToken;
}

function closePanel() {
  if (!panel.classList.contains('open')) return;
  panelToken += 1;
  panel.classList.remove('open');
  panel.setAttribute('aria-hidden', 'true');
  backdrop.classList.remove('open');
  panelOpener?.focus?.();
}

function panelAction(text, action) {
  const actions = element('div', undefined, 'actions');
  const button = element('button', text, 'button primary');
  button.type = 'button';
  button.addEventListener('click', action);
  actions.append(button);
  panel.append(actions);
}

function factList() {
  const facts = element('dl', undefined, 'facts');
  const fact = (name, value) => { if (value) facts.append(element('dt', name), element('dd', value)); };
  return {facts, fact};
}

function shareList(title, items, total) {
  const shown = items.filter(item => item.cost > 0).slice(0, PANEL_ROWS);
  if (!shown.length) return;
  panel.append(element('h3', title));
  const list = element('div', undefined, 'shares');
  for (const item of shown) {
    const row = element('div', undefined, 'row');
    const bar = element('span', undefined, 'share');
    const track = element('span', undefined, 'track');
    const fill = element('span');
    fill.style.width = Math.max(total > 0 ? item.cost / total * 100 : 0, 1) + '%';
    if (item.color) fill.style.setProperty('--swatch', item.color);
    track.append(fill);
    bar.append(track);
    const name = element('span', item.label);
    name.title = item.label;
    row.append(name, bar, element('b', dollars(item.cost)));
    list.append(row);
  }
  panel.append(list);
}

function sessionList(sessions) {
  if (!sessions.length) return;
  panel.append(element('h3', 'Biggest sessions'));
  const list = element('div', undefined, 'panel-sessions');
  for (const session of sessions) {
    const button = element('button');
    button.type = 'button';
    button.append(element('span', session.title ?? 'Untitled session', 'title'), element('b', dollars(session.cost_usd)), element('small', sessionMeta(session)));
    button.addEventListener('click', () => openPanel(session));
    list.append(button);
  }
  panel.append(list);
}

function dayBars(days, first, last) {
  const byDay = new Map();
  for (const entry of days) byDay.set(entry.day, (byDay.get(entry.day) || 0) + entry.cost_usd);
  const all = daysBetween(first, last);
  const values = all.map(day => byDay.get(day) || 0);
  const max = Math.max(...values, 0.01);
  const width = 392, height = 72, lower = 16;
  const slot = width / all.length;
  const barWidth = Math.min(10, Math.max(slot * 0.7, 1));
  const root = svg('svg', {viewBox: `0 0 ${width} ${height}`, role: 'img', 'aria-label': `Spend per day from ${shortDate(first)} to ${shortDate(last)}`, class: 'day-bars'});
  root.append(svg('line', {x1: 0, x2: width, y1: height - lower, y2: height - lower, stroke: 'var(--axis)', 'stroke-width': 1}));
  values.forEach((value, index) => {
    if (value <= 0) return;
    const barHeight = Math.max(1, value / max * (height - lower - 4));
    const bar = svg('rect', {x: index * slot + (slot - barWidth) / 2, y: height - lower - barHeight, width: barWidth, height: barHeight, fill: 'var(--accent)', rx: barWidth > 4 ? 1.5 : 0});
    const title = svg('title', {});
    title.textContent = `${shortDate(all[index])}: ${dollars(value)}`;
    bar.append(title);
    root.append(bar);
  });
  for (const [day, anchor, x] of [[first, 'start', 0], [last, 'end', width]]) {
    const label = svg('text', {x, y: height - 3, 'text-anchor': anchor});
    label.textContent = shortDate(day);
    root.append(label);
  }
  const box = element('div', undefined, 'chart panel-chart');
  box.append(root);
  return box;
}

const PAID_FOR_MEANS = {
  input_usd: 'Most of this is fresh input that was not cached.',
  output_usd: 'Most of this is output: what the model wrote, including thinking. A cheaper model or lower effort for this work cuts it.',
  cache_write_usd: 'Most of this is cache writes: context built from scratch when a session or subagent starts, or after the cache expires during a pause. Fewer subagent launches and cold restarts cut it.',
  cache_read_usd: 'Most of this is cache reads: a long context read again on every turn. Starting fresh with /clear when you switch tasks cuts it.',
};

function paidFor(rows) {
  const totals = {input_usd: 0, output_usd: 0, cache_write_usd: 0, cache_read_usd: 0};
  for (const row of rows) for (const field of Object.keys(totals)) totals[field] += row[field] ?? 0;
  const total = Object.values(totals).reduce((sum, value) => sum + value, 0);
  if (total <= 0) return;
  shareList('Paid for', MIX_PARTS.map(([field, label, slot]) => ({label, cost: totals[field], color: `var(${slot})`})), total);
  const largest = Object.keys(totals).reduce((best, field) => totals[field] > totals[best] ? field : best);
  panel.append(element('p', `${PAID_FOR_MEANS[largest]} Split at list price, so read it as proportions.`, 'note panel-paid'));
}

function loadingNote() {
  const note = element('p', 'Loading…', 'note');
  panel.append(note);
  return note;
}

function failed(note, error) {
  note.className = 'note error';
  note.textContent = `Can't load: ${error.message}`;
}

function splitQuery(params, by) {
  const query = new URLSearchParams(params);
  query.set('by', by);
  return '/api/data?' + query;
}

async function addressKey(item, label) {
  if (item.kind !== 'repo' || !label || label === item.key) return item.key;
  try {
    const repos = await fetchJson('/api/data?range=all&by=repo');
    const keys = new Set(repos.rows.filter(row => row.label === label).map(row => row.key));
    return keys.size === 1 && keys.has(item.key) ? label : item.key;
  } catch {
    return item.key;
  }
}

async function openRowPanel(row, level) {
  const kind = SCOPE_OF_LEVEL[level];
  const name = rowName(row, level);
  const item = {kind, key: row.key, label: kind === 'repo' ? row.label : scopeLabel(kind, row.key)};
  const token = panelShell(name, state.scope.length ? `${GROUP_NAMES[kind]} in ${scopeTitle()}` : GROUP_NAMES[kind]);
  panelAction(`Focus the page on ${name}`, async () => focusOn({...item, key: await addressKey(item, row.label)}));
  const note = loadingNote();
  const view = buildView();
  const withRow = params => scopeParams(params, [item]);
  const splits = NEXT[kind].filter(other => !scopedKinds().has(other) && other !== kind).slice(0, 3);
  const seriesQuery = withRow(rangeParams());
  seriesQuery.set('by', 'model');
  seriesQuery.set('top', '1');
  const sessionsQuery = withRow(rangeParams());
  sessionsQuery.set('limit', String(PANEL_SESSIONS));
  const previousQuery = view.previousLabel ? withRow(new URLSearchParams(latest.previous.params)) : null;
  try {
    const mixQuery = withRow(rangeParams());
    mixQuery.set('by', 'model');
    const [series, sessions, previous, mix, ...answers] = await Promise.all([
      fetchJson('/api/series?' + seriesQuery),
      fetchJson('/api/sessions?' + sessionsQuery),
      previousQuery ? fetchJson('/api/data?' + previousQuery) : null,
      fetchJson('/api/mix?' + mixQuery),
      ...splits.map(split => fetchJson(splitQuery(withRow(rangeParams()), split))),
    ]);
    if (token !== panelToken) return;
    note.remove();
    const days = forAccount(series.days);
    const spend = days.reduce((sum, day) => sum + day.cost_usd, 0);
    const viewTotal = cost(view.rows);
    const {facts, fact} = factList();
    fact('Cost', `${dollars(spend)} · ${view.period}`);
    if (viewTotal > 0) fact('Share', `${shareText(spend / viewTotal)} of ${state.scope.length ? scopeTitle() : 'all spend'} in this range`);
    if (previous) {
      const before = cost(forAccount(previous.rows));
      fact('Before', before > 0 ? `${multiple(spend / before)} vs ${view.previousLabel} (${money(before)})` : `Nothing in ${view.previousLabel}`);
    }
    const count = sessionCount(sessions);
    if (count) fact('Sessions', count.toLocaleString());
    panel.append(facts, element('h3', 'Per day'), dayBars(days, view.first, view.last));
    paidFor(forAccount(mix.rows));
    splits.forEach((split, index) => {
      const answer = answers[index];
      const rows = mergeRows(forAccount(answer.rows));
      shareList('By ' + GROUP_NAMES[split].toLowerCase(), rows.map(entry => ({label: rowName(entry, answer.level), cost: entry.cost_usd ?? 0})), spend);
    });
    sessionList(forAccount(sessions.sessions).slice(0, PANEL_SESSIONS));
  } catch (error) {
    if (token === panelToken) failed(note, error);
  }
}

async function openNotInTranscriptsPanel() {
  const view = buildView();
  const token = panelShell(NOT_IN_TRANSCRIPTS, state.scope.length ? scopeTitle() : view.accountLabel ?? 'All accounts');
  panel.append(element('p', 'Spend Claude Code billed for requests it never wrote to its session transcripts. Gigawatts compares the cost Claude Code records for each session and model with what the transcripts hold, and keeps the difference here so totals match what Claude Code reports.', 'panel-text'));
  panel.append(element('p', 'Which requests these were is unknown; they come from Claude Code itself, and a Haiku share suggests background calls. Each one\'s session, model, repo, and branch are known, so the repo, branch, and model breakdowns count it there. Its skill and subagent are not, so those breakdowns show it as its own row rather than guess.', 'panel-text'));
  const note = loadingNote();
  const byModel = params => { params.set('by', 'model'); return '/api/data?' + params; };
  const seriesQuery = scopeParams(rangeParams());
  seriesQuery.set('by', 'model');
  seriesQuery.set('top', '20');
  try {
    const [models, series, previous, mix] = await Promise.all([
      fetchJson(byModel(scopeParams(rangeParams()))),
      fetchJson('/api/series?' + seriesQuery),
      view.previousLabel ? fetchJson(byModel(scopeParams(new URLSearchParams(latest.previous.params)))) : null,
      fetchJson('/api/mix?' + (() => { const params = scopeParams(rangeParams()); params.set('by', 'model'); return params; })()),
    ]);
    if (token !== panelToken) return;
    note.remove();
    const rows = mergeRows(forAccount(models.rows));
    const missing = rows.filter(row => row.not_in_transcript);
    const spend = cost(missing);
    const total = cost(rows);
    const {facts, fact} = factList();
    fact('Cost', `${dollars(spend)} · ${view.period}`);
    if (total > 0) fact('Share', `${shareText(spend / total)} of ${state.scope.length ? scopeTitle() : 'all spend'} in this range`);
    if (previous) {
      const before = cost(forAccount(previous.rows).filter(row => row.not_in_transcript));
      fact('Before', before > 0 ? `${multiple(spend / before)} vs ${view.previousLabel} (${money(before)})` : `Nothing in ${view.previousLabel}`);
    }
    panel.append(facts);
    panel.append(element('h3', 'Per day'), dayBars(forAccount(series.days).filter(entry => entry.not_in_transcript), view.first, view.last));
    paidFor(forAccount(mix.rows).filter(row => row.not_in_transcript));
    shareList('By model', missing.map(row => ({label: prettyModel(row.label), cost: row.cost_usd ?? 0})), spend);
  } catch (error) {
    if (token === panelToken) failed(note, error);
  }
}

async function openDayPanel(day, total, parts) {
  const view = buildView();
  const title = new Date(day + 'T00:00:00Z').toLocaleDateString(undefined, {weekday: 'long', month: 'long', day: 'numeric', year: 'numeric', timeZone: 'UTC'});
  const token = panelShell(title, state.scope.length ? scopeTitle() : view.accountLabel ?? 'All accounts');
  panelAction('Show just this day', () => {
    state.range = 'custom';
    state.since = day;
    state.until = day;
    navigate();
  });
  const byDay = new Map();
  for (const entry of view.series) byDay.set(entry.day, (byDay.get(entry.day) || 0) + entry.cost_usd);
  const active = [...byDay.values()].filter(value => value > 0);
  const average = active.length ? active.reduce((sum, value) => sum + value, 0) / active.length : 0;
  const {facts, fact} = factList();
  fact('Spend', dollars(total));
  if (average > 0 && active.length > 1) fact('Usual', `${multiple(total / average)} vs the average active day in this range (${money(average)})`);
  panel.append(facts);
  const chartBy = chartGrouping();
  shareList('By ' + GROUP_NAMES[chartBy].toLowerCase(), parts.map(([label, value, color]) => ({label, cost: value, color})), total);
  const note = loadingNote();
  const dayParams = () => {
    const params = scopeParams(new URLSearchParams());
    params.set('since', day);
    params.set('until', day);
    return params;
  };
  const splits = groupings().filter(kind => kind !== chartBy).slice(0, 2);
  const sessionsQuery = dayParams();
  sessionsQuery.set('limit', String(PANEL_SESSIONS));
  const mixQuery = dayParams();
  mixQuery.set('by', 'model');
  try {
    const [sessions, mix, ...answers] = await Promise.all([
      fetchJson('/api/sessions?' + sessionsQuery),
      fetchJson('/api/mix?' + mixQuery),
      ...splits.map(split => fetchJson(splitQuery(dayParams(), split))),
    ]);
    if (token !== panelToken) return;
    note.remove();
    paidFor(forAccount(mix.rows));
    splits.forEach((split, index) => {
      const answer = answers[index];
      shareList('By ' + GROUP_NAMES[split].toLowerCase(), mergeRows(forAccount(answer.rows)).map(entry => ({label: rowName(entry, answer.level), cost: entry.cost_usd ?? 0})), total);
    });
    sessionList(forAccount(sessions.sessions).slice(0, PANEL_SESSIONS));
  } catch (error) {
    if (token === panelToken) failed(note, error);
  }
}

function openPanel(session) {
  panelShell(session.title ?? 'Untitled session', session.session);
  const {facts, fact} = factList();
  fact('Cost', `${dollars(session.cost_usd)} · ${session.cost_status === 'exact' ? 'matches Claude Code' : session.cost_status === 'adjusted' ? 'adjusted to Claude Code' : 'estimated'}`);
  fact('Where', session.branch ? `${session.repo} · ${session.branch}` : session.repo);
  if (session.first_ms) fact('When', `${new Date(session.first_ms).toLocaleString(undefined, {weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit'})} to ${new Date(session.last_ms).toLocaleString(undefined, {hour: 'numeric', minute: '2-digit'})}${localDay(new Date(session.first_ms)) !== localDay(new Date(session.last_ms)) ? ' ' + longDate(session.last_ms) : ''}`);
  fact('Active', session.active_minutes ? `${minutes(session.active_minutes)} (gaps over 10 min left out)` : null);
  fact('Requests', session.requests.toLocaleString());
  fact('Peak context', session.peak_context ? `${compact(session.peak_context)} tokens in your own conversation` : null);
  panel.append(facts);
  const shares = (title, list, name) => shareList(title, list.map(share => ({label: name(share.label), cost: share.share * session.cost_usd})), session.cost_usd);
  shares('Skills', session.skills, skillName);
  shares('Models', session.models, prettyModel);
  shares('Subagents', session.agents, agentName);
  panel.append(element('p', 'Numbers cover the selected range. Costs per skill, model, and subagent are the session cost split by each one\'s share.', 'note'));
}

backdrop.addEventListener('click', closePanel);
document.addEventListener('keydown', event => {
  if (event.key === 'Escape') { closePanel(); closeMenu(); }
});

// Theme

const THEMES = [['auto', 'Auto', 'Follows your system'], ['light', 'Light'], ['dark', 'Dark']];
const THEME_KEY = 'gigawatts-theme';
const themeButton = document.getElementById('theme-button');
const themeMenu = document.getElementById('theme-menu');

function drawTheme() {
  const current = document.documentElement.dataset.theme ?? 'auto';
  const [, name] = THEMES.find(([value]) => value === current);
  themeButton.replaceChildren(icon(current), element('span', name, 'value'), icon('caret', 'caret'));
  themeMenu.replaceChildren(...THEMES.map(([value, label, meta]) => menuItem({
    label,
    meta,
    checked: value === current,
    onPick: () => pickTheme(value),
  })));
}

function pickTheme(value) {
  if (value === 'auto') delete document.documentElement.dataset.theme;
  else document.documentElement.dataset.theme = value;
  try {
    if (value === 'auto') localStorage.removeItem(THEME_KEY);
    else localStorage.setItem(THEME_KEY, value);
  } catch {}
  drawTheme();
}

drawTheme();
setupPopover(themeButton, themeMenu);

// Export

const exportButton = document.getElementById('export');
const exportMenu = document.getElementById('export-menu');
const FOOTNOTE = 'Costs come from Claude Code\'s local transcripts, priced at list price unless Claude Code recorded the session\'s own cost. Credits and limits come from Claude Code\'s usage readings. This summary leaves out repo, branch, and session names, except a scope you focused on. Skill, subagent, and model names are shown as they are named. "Not in transcripts" is spend Claude Code billed for requests it did not write to its transcripts, so it has a model but no skill or subagent.';

function exportLabel(text) {
  exportButton.replaceChildren(icon('download'), element('span', text, 'value'));
}

exportLabel('Export');
setupPopover(exportButton, exportMenu);

const EXPORTS = {
  markdown: summary => download(fileName(summary, 'md'), markdown(summary), 'text/markdown'),
  pdf: summary => printSummary(summary),
};

for (const item of exportMenu.querySelectorAll('[data-export]')) {
  item.addEventListener('click', async () => {
    closeMenu();
    try {
      await EXPORTS[item.dataset.export](await summaryData());
    } catch (error) {
      exportLabel('Export failed');
      exportButton.title = error.message;
    }
    setTimeout(() => { exportLabel('Export'); exportButton.removeAttribute('title'); }, 2000);
  });
}

function slug(text) {
  return text.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
}

function fileName(summary, extension) {
  const {view} = summary;
  const pieces = ['gigawatts', slug(view.shareableLabel || 'all accounts'), state.scope.length ? slug(scopeTitle()) : null, view.first, 'to', view.last];
  return pieces.filter(Boolean).join('-') + '.' + extension;
}

function download(name, text, type) {
  const link = element('a');
  link.href = URL.createObjectURL(new Blob([text], {type: type + ';charset=utf-8'}));
  link.download = name;
  document.body.append(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(link.href), 1000);
}

async function summaryData() {
  const view = buildView();
  const taken = scopedKinds();
  const chartBy = taken.has('model') ? 'skill' : 'model';
  const tables = ['model', 'skill'].filter(kind => !taken.has(kind));
  const query = scopeParams(rangeParams());
  const by = (kind, top) => {
    const params = new URLSearchParams(query);
    params.set('by', kind);
    if (top) params.set('top', String(top));
    return params;
  };
  const before = kind => {
    const params = scopeParams(new URLSearchParams(latest.previous.params));
    params.set('by', kind);
    return fetchJson('/api/data?' + params);
  };
  const compare = Boolean(view.previousLabel);
  const [series, ...answers] = await Promise.all([
    fetchJson('/api/series?' + by(chartBy, 20)),
    ...tables.flatMap(kind => [fetchJson('/api/data?' + by(kind)), fetchJson('/api/mix?' + by(kind)), compare ? before(kind) : null]),
  ]);
  const breakdowns = tables.map((kind, index) => {
    const [data, mix, previous] = answers.slice(index * 3, index * 3 + 3);
    return {
      kind,
      level: data.level,
      rows: mergeRows(forAccount(data.rows)),
      mix: mergeMix(forAccount(mix.rows)),
      previous: previous ? {label: view.previousLabel, dates: latest.previous.dates, costs: new Map(mergeRows(forAccount(previous.rows)).map(row => [rowId(row), row.cost_usd ?? 0]))} : null,
    };
  });
  const title = ['Gigawatts', view.shareableLabel || 'All accounts', state.scope.length ? scopeTitle() : null].filter(Boolean).join(' · ');
  return {view, chartBy, series: forAccount(series.days), breakdowns, title, exportedAt: new Date()};
}

function exportedLine(summary) {
  return `${summary.view.period} · exported ${summary.exportedAt.toLocaleString(undefined, {month: 'short', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit'})}`;
}

function summaryCards(summary) {
  const {view} = summary;
  const cards = [summaryHeadline(view)];
  cards.push(spendChart(view, summary.chartBy, summary.series, false).card);
  for (const table of summary.breakdowns) cards.push(staticBreakdown('By ' + GROUP_NAMES[table.kind].toLowerCase(), table.rows, table.level, new Map(table.mix), table.previous));
  cards.push(whoDidTheWork(view.agents, false));
  return cards;
}

function cellText(cell) {
  const text = cell.textContent.replace(/\s+/g, ' ').trim();
  return text || cell.querySelector('[title]')?.title || '';
}

function markdownCell(text) {
  return text.replace(/\|/g, '\\|').replace(/\s+/g, ' ').trim();
}

function markdownTable(header, rows) {
  const line = cells => '| ' + cells.map(markdownCell).join(' | ') + ' |';
  return [line(header), line(header.map(() => '---')), ...rows.map(line)].join('\n');
}

function domTable(table) {
  const header = [...table.querySelectorAll('thead th')].map(cellText);
  const rows = [...table.querySelectorAll('tbody tr, tfoot tr')].map(row => [...row.cells].map(cellText));
  return markdownTable(header, rows);
}

function dailyColumns(summary) {
  const {order, labels} = seriesColors(summary.series);
  const days = daysBetween(summary.view.first, summary.view.last);
  const bucket = days.length > 92 ? day => day.slice(0, 7) : day => day;
  const buckets = new Map();
  for (const day of days) if (!buckets.has(bucket(day))) buckets.set(bucket(day), new Map());
  for (const entry of summary.series) {
    const values = buckets.get(bucket(entry.day));
    if (!values) continue;
    const id = order.includes(seriesId(entry)) ? seriesId(entry) : 'other';
    values.set(id, (values.get(id) || 0) + entry.cost_usd);
  }
  return {order, labels, buckets, unit: days.length > 92 ? 'Month' : 'Day'};
}

function markdown(summary) {
  const parts = [`# ${summary.title}`, exportedLine(summary)];
  for (const card of summaryCards(summary)) {
    if (card.classList.contains('account-line')) { parts.push(card.textContent); continue; }
    const heading = card.querySelector('h2')?.textContent;
    const sentence = card.querySelector('.summary')?.textContent;
    const tiles = [...card.querySelectorAll('.tile')];
    if (tiles.length) {
      if (sentence) parts.push(sentence);
      parts.push(markdownTable(['Number', 'Value', 'Detail'], tiles.map(tile => [
        tile.querySelector('.label').textContent,
        tile.querySelector('.value').textContent,
        [...tile.querySelectorAll('.sub')].map(sub => sub.textContent).join('; '),
      ])));
      continue;
    }
    if (card.querySelector('.chart')) {
      const {order, labels, buckets, unit} = dailyColumns(summary);
      parts.push(`## Spend per ${unit.toLowerCase()}, by ${GROUP_NAMES[summary.chartBy].toLowerCase()}`);
      const rows = [...buckets].map(([when, values]) => [when, dollars([...values.values()].reduce((sum, value) => sum + value, 0)), ...order.map(id => values.get(id) ? dollars(values.get(id)) : '')]);
      parts.push(markdownTable([unit, 'Total', ...order.map(id => labels.get(id) ?? 'Other')], rows));
      continue;
    }
    const table = card.querySelector('table');
    const note = card.querySelector('.card-head .hint')?.textContent;
    if (heading && table) parts.push(`## ${heading}`, ...(note?.startsWith('Change compares') ? [note + '.'] : []), domTable(table));
  }
  parts.push('"Paid for" splits each cost by token type at list price.', FOOTNOTE);
  return parts.join('\n\n') + '\n';
}

function printSummary(summary) {
  const container = element('main', undefined, 'exported');
  const top = element('div', undefined, 'topbar');
  top.append(element('h1', summary.title));
  container.append(top, element('p', exportedLine(summary), 'source'));
  const stack = element('div', undefined, 'stack');
  stack.append(...summaryCards(summary));
  container.append(stack, element('p', FOOTNOTE, 'footnote'));
  document.getElementById('print').replaceChildren(container);
  document.body.classList.add('printing');
  document.title = fileName(summary, 'pdf').replace(/\.pdf$/, '');
  window.print();
}

window.addEventListener('afterprint', () => {
  document.body.classList.remove('printing');
  document.getElementById('print').replaceChildren();
  document.title = 'Gigawatts report';
});

window.gigawattsSummary = async () => markdown(await summaryData());

// Loading

async function fetchJson(path) {
  const answer = await fetch(path);
  const body = await answer.json();
  if (!answer.ok) throw new Error(body.error);
  return body;
}

function insightsFailure() {
  const card = element('section', undefined, 'card');
  card.append(element('h2', 'Insights'));
  card.append(element('p', `Can't load insights: ${insightsError}`, 'note'));
  return card;
}

function loadInsights() {
  if (insightsAnswer || insightsRequest) return;
  insightsRequest = fetchJson('/api/insights').then(answer => {
    insightsAnswer = answer;
    insightsError = null;
    if (latest) latest.insights = answer;
  }, error => {
    insightsRequest = null;
    insightsError = error.message;
  }).then(() => {
    if (latest) render();
  });
}

function previousParams(data, first) {
  if (!first || (!data.since && state.range === 'all')) return null;
  let since, until, label;
  if (state.range === 'month' || state.range === 'lastmonth') {
    const before = lastMonthBounds(state.range === 'month' ? data.today : first);
    since = before.since;
    until = state.range === 'month' ? before.sameDay : before.until;
    label = state.range === 'month' ? `${shortDate(since)} to ${shortDate(until)}` : before.name;
  } else {
    const length = dayCount(first, data.until || data.today);
    since = addDays(first, -length);
    until = addDays(first, -1);
    label = `the ${length} days before`;
  }
  const params = new URLSearchParams();
  params.set('since', since);
  params.set('until', until);
  params.set('by', 'model');
  return {params, label, dates: `${shortDate(since)} to ${shortDate(until)}`};
}

function sessionCount(answer) {
  if (state.account === ALL) return answer.total;
  return answer.per_account.find(count => count.account === state.account)?.sessions ?? 0;
}

async function load() {
  writeState();
  loadedHash = location.hash;
  const content = document.getElementById('content');
  content.style.opacity = '0.55';
  const scoped = state.scope.length > 0;
  const dataQuery = scopeParams(rangeParams());
  dataQuery.set('by', breakdownGrouping());
  const seriesQuery = scopeParams(rangeParams());
  seriesQuery.set('by', chartGrouping());
  seriesQuery.set('top', '20');
  const sessionsQuery = scopeParams(rangeParams());
  sessionsQuery.set('limit', '10');
  const accountQuery = rangeParams();
  accountQuery.set('by', 'model');
  try {
    const [now, data, mix, series, agents, month, sessions, history, accountData, advice, limits] = await Promise.all([
      fetchJson('/api/now'),
      fetchJson('/api/data?' + dataQuery),
      fetchJson('/api/mix?' + dataQuery),
      fetchJson('/api/series?' + seriesQuery),
      fetchJson('/api/agents?' + scopeParams(rangeParams())),
      fetchJson('/api/series?range=month&by=model&top=1'),
      fetchJson('/api/sessions?' + sessionsQuery),
      fetchJson('/api/series?range=all&by=model&top=1'),
      scoped ? fetchJson('/api/data?' + accountQuery) : null,
      fetchJson('/api/advice'),
      fetchJson('/api/limits?' + rangeParams()),
    ]);
    const last = data.until || data.today;
    const first = data.since || series.days.map(day => day.day).sort()[0] || last;
    const previous = previousParams(data, first);
    const lastMonth = lastMonthBounds(data.today);
    const [previousData, lastMonthData] = await Promise.all([
      previous ? fetchJson('/api/data?' + scopeParams(new URLSearchParams(previous.params))) : null,
      fetchJson(`/api/data?since=${lastMonth.since}&until=${lastMonth.sameDay}&by=model`),
    ]);
    latest = {now, data, mix, series, agents, month, sessions, history, first, last, previous, previousData, lastMonth, lastMonthData, accountData, advice, limits, insights: insightsAnswer};
    render();
    if (!scoped) loadInsights();
  } catch (error) {
    const source = document.getElementById('source');
    source.className = 'source error';
    source.textContent = `Can't load the report: ${error.message}`;
  } finally {
    content.style.opacity = '';
  }
}

function buildView() {
  const {now, data, mix, series, agents, month, sessions, history, first, last, previous, previousData, lastMonth, lastMonthData, accountData} = latest;
  const firstRecord = forAccount(history.days).map(day => day.day).sort()[0];
  const recordedFrom = firstRecord ? addDays(firstRecord, 1) : data.today;
  const monthByDay = new Map();
  for (const entry of forAccount(month.days)) monthByDay.set(entry.day, (monthByDay.get(entry.day) || 0) + entry.cost_usd);
  const accountNow = state.account === ALL ? null : now.accounts.find(account => account.account === state.account);
  const sameYear = first.slice(0, 4) === last.slice(0, 4);
  const period = `${shortDate(first)}${sameYear ? '' : ', ' + first.slice(0, 4)} to ${shortDate(last)}, ${last.slice(0, 4)}`;
  const covered = previous && recordedFrom <= previous.params.get('since');
  return {
    rows: mergeRows(forAccount(data.rows)),
    mix: mergeMix(forAccount(mix.rows)),
    previousRows: previousData ? forAccount(previousData.rows) : [],
    previousLabel: covered ? previous.label : null,
    historyStart: previous && !covered ? recordedFrom : null,
    series: forAccount(series.days),
    month: [...monthByDay].map(([day, cost_usd]) => ({day, cost_usd})),
    now: accountNow,
    accountLabel: accountNow?.account_label ?? null,
    shareableLabel: accountNow ? accountNow.configured_label ?? 'Account' : null,
    accountRows: accountData ? forAccount(accountData.rows) : null,
    today: data.today,
    first, last, period,
    level: data.level,
    agents: forAccount(agents.rows),
    sessions: forAccount(sessions.sessions).slice(0, 10),
    sessionCount: sessionCount(sessions),
    keptFrom: sessions.kept_from,
    lastMonth: recordedFrom <= lastMonth.since ? {name: lastMonth.name, spend: cost(forAccount(lastMonthData.rows))} : null,
  };
}

function render() {
  if (!latest) return;
  const known = latest.now.accounts.map(account => account.account);
  if (!known.includes(state.account) && state.account !== ALL) {
    state.account = latest.now.accounts.find(account => slug(account.account_label ?? '') === state.account)?.account ?? known[0] ?? ALL;
  }
  writeState();
  loadedHash = location.hash;
  const view = buildView();
  drawControls(latest.now.accounts, view);
  const source = document.getElementById('source');
  source.className = 'source';
  source.textContent = `From the history database at ${new Date().toLocaleTimeString([], {hour: 'numeric', minute: '2-digit'})} · reload for newer numbers`;
  drawnWidth = chartWidth();
  const chart = spendChart(view, chartGrouping(), view.series, true);
  const sections = [];
  if (state.scope.length) {
    const line = accountLine(view);
    if (line) sections.push(line);
    sections.push(scopedHeadline(view));
  } else {
    sections.push(headline(view, false));
  }
  sections.push(chart.card);
  sections.push(limitsOverTime(view));
  const where = breakdown(view, chart.colors);
  const who = whoDidTheWork(view.agents, true);
  sections.push(...(primaryScope() === 'model' ? [who, where] : [where, who]));
  sections.push(biggestSessions(view));
  const advice = adviceCard(view);
  if (advice) sections.push(advice);
  const insights = insightsCard();
  if (insights) sections.push(insights);
  document.getElementById('content').replaceChildren(...sections);
  drawProblems();
}

function drawProblems() {
  const box = document.getElementById('problems');
  const problems = latest.data.problems.filter(problem => state.account === ALL || !problem.account || problem.account === state.account);
  box.hidden = problems.length === 0;
  if (!problems.length) return box.replaceChildren();
  const one = problems.length === 1;
  const list = element('ul');
  for (const problem of problems) {
    const item = element('li');
    const since = problem.since ? ` · since ${/^\d{4}-\d{2}-\d{2}/.test(problem.since) ? shortDate(problem.since.slice(0, 10)) : problem.since}` : '';
    item.append(element('div', capitalized(problem.affects) + since), element('div', capitalized(problem.cause), 'faint'));
    list.append(item);
  }
  const lead = element('span', `${one ? 'A problem with the data makes' : `${problems.length} problems with the data make`} some numbers here wrong. `, 'status-line warning');
  const command = element('span');
  command.append(element('code', 'gigawatts doctor'), ` says how to fix ${one ? 'it' : 'them'}.`);
  lead.append(command);
  box.replaceChildren(lead, list);
}

function capitalized(text) {
  return text.charAt(0).toUpperCase() + text.slice(1);
}

function onAddressChange() {
  if (location.hash === loadedHash) return;
  state = readState();
  showTail = false;
  closePanel();
  load();
}

let resizeTimer = null;
let drawnWidth = null;
function onResize() {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    if (!latest || chartWidth() === drawnWidth) return;
    render();
  }, 150);
}

window.addEventListener('popstate', onAddressChange);
window.addEventListener('hashchange', onAddressChange);
window.addEventListener('resize', onResize);
load();
</script>
