.rank { display: grid; grid-template-columns: minmax(0, 1fr) minmax(40px, 28%) 64px 36px; gap: var(--space-3); align-items: center; min-height: 36px; padding: 0 var(--space-2); margin: 0 calc(-1 * var(--space-2)); border-radius: 6px; font-variant-numeric: tabular-nums; }

.rank.clickable:hover, .rank.clickable:focus-visible { background: var(--hover); outline: none; }
.rank-list.code .rank:not(.others) .name-text { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: var(--text-sm); }

.paid-bar span:first-child { border-radius: 4px 0 0 4px; }

.paid-means { grid-column: 2 / 3; color: var(--muted); font-size: var(--text-sm); }
.paid-before { grid-column: 3 / 5; text-align: right; color: var(--muted); font-size: var(--text-xs); white-space: nowrap; }
.share { display: flex; align-items: center; gap: var(--space-3); }

.mix span:last-child { border-top-right-radius: 4px; border-bottom-right-radius: 4px; }

.panel-backdrop { position: fixed; inset: 0; background: rgb(0 0 0 / 0.25); z-index: 7; display: none; }
.panel-backdrop.open { display: block; }
.panel { position: fixed; top: 0; right: 0; bottom: 0; width: min(440px, 100vw); z-index: 8; background: var(--surface); border-left: 1px solid var(--ring); box-shadow: -12px 0 40px rgb(0 0 0 / 0.18); padding: var(--space-6); overflow-y: auto; transform: translateX(100%); transition: transform 160ms ease; }

.shares .row span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.panel-sub { margin: 0; color: var(--muted); overflow-wrap: anywhere; }

.button.primary:hover { background: color-mix(in srgb, var(--accent) 88%, var(--ink)); }
.panel-chart { margin-bottom: var(--space-8); }
.panel-chart text { font-size: 10px; }
.panel-sessions { display: grid; gap: 2px; margin: 0 calc(-1 * var(--space-2)) var(--space-8); }
.panel-sessions button { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px var(--space-3); text-align: left; border: 0; background: none; padding: var(--space-2); border-radius: 8px; }
.panel-sessions button:hover { background: var(--hover); }
.panel-sessions .title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.panel-sessions b { font-weight: 500; font-variant-numeric: tabular-nums; }
.panel-sessions small { grid-column: 1 / -1; color: var(--muted); font-size: var(--text-xs); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chart rect.day { cursor: pointer; }
.chart rect.day:hover, .chart rect.day:focus-visible { fill: color-mix(in srgb, var(--ink) 5%, transparent); outline: none; }

.panel-paid { margin: calc(-1 * var(--space-5)) 0 var(--space-8); }
.panel-text { margin: var(--space-3) 0 0; color: var(--ink-2); line-height: 1.55; }
.event-chart + .event-chart { margin-top: var(--space-6); }
.event-chart .takeaway-head { margin-bottom: var(--space-2); }
.event-chart .week-chart { margin: 0; }
.week-bar.before { background: color-mix(in srgb, var(--accent) 35%, transparent); }
.insight-link.clickable:hover, .insight-link.clickable:focus-visible { background: var(--hover); outline: none; }
.insight-links { margin: var(--space-3) 0 var(--space-8); }
.insight-link { display: flex; justify-content: space-between; gap: var(--space-3); padding: var(--space-2); margin: 0 calc(-1 * var(--space-2)); border-bottom: 1px solid var(--grid); border-radius: 6px; }
.link-button.inline { padding: 0; }
.name-text + .link-button { margin-left: var(--space-2); font-weight: 400; }
.week-chart { margin: var(--space-3) 0 var(--space-8); }
.week-top { display: flex; justify-content: space-between; color: var(--muted); font-size: var(--text-xs); font-variant-numeric: tabular-nums; border-bottom: 1px dashed var(--grid); padding-bottom: 2px; }
.week-cols { display: grid; grid-template-columns: repeat(var(--weeks), minmax(0, 1fr)); gap: 2px; }
.week-col { display: grid; grid-template-rows: 96px auto auto; text-align: center; font-size: var(--text-xs); color: var(--muted); font-variant-numeric: tabular-nums; border-radius: 4px; outline: none; }
.week-col:hover, .week-col:focus-visible { background: var(--hover); }
.week-plot { position: relative; display: flex; align-items: flex-end; justify-content: center; border-bottom: 1px solid var(--ring); }
.week-bar { width: 60%; max-width: 28px; background: var(--accent); border-radius: 4px 4px 0 0; }
.week-shift { position: absolute; left: 50%; width: 8px; height: 8px; margin: 0 0 4px -4px; border-radius: 50%; background: var(--ink); box-shadow: 0 0 0 2px var(--surface); }
.week-col span:first-of-type { margin-top: var(--space-1); color: var(--ink-2); }
.takeaways { display: grid; gap: var(--space-5); margin: var(--space-3) 0 var(--space-8); }
.takeaway-head { display: flex; justify-content: space-between; gap: var(--space-3); align-items: baseline; }
.takeaway-head b { font-weight: 500; }
.takeaway-head span { white-space: nowrap; font-variant-numeric: tabular-nums; }
.takeaway p, .change-block p { margin: var(--space-1) 0 0; color: var(--ink-2); line-height: 1.5; }
.next-step { margin-bottom: var(--space-8); }
.week-note { margin: var(--space-2) 0 0; color: var(--muted); font-size: var(--text-xs); }
.prompt { margin: var(--space-3) 0 0; padding: var(--space-3); border: 1px solid var(--grid); border-radius: 8px; font-family: var(--mono, ui-monospace, monospace); font-size: var(--text-sm); overflow-wrap: anywhere; }
.card-head .title { display: flex; flex-wrap: wrap; align-items: baseline; gap: var(--space-1) var(--space-3); min-width: 0; }
.todo { display: grid; }
.todo-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--space-4); align-items: center; padding: var(--space-3) var(--space-2); margin: 0 calc(-1 * var(--space-2)); border-bottom: 1px solid var(--grid); border-radius: 6px; }
.todo-row:last-child { border-bottom: 0; }
.todo-row.clickable:hover, .todo-row.clickable:focus-visible { background: var(--hover); outline: none; }
.todo-what { font-weight: 500; overflow-wrap: anywhere; }
.todo-what .dim { font-weight: 400; }
.todo-why { color: var(--muted); font-size: var(--text-sm); margin-top: 2px; overflow-wrap: anywhere; }
.todo-amount { text-align: right; font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; }
.todo-amount small { display: block; color: var(--muted); font-size: var(--text-xs); font-weight: 400; }

.todo-amount.muted { color: var(--muted); font-weight: 400; }
.totals { display: flex; flex-wrap: wrap; width: fit-content; gap: var(--space-2) var(--space-8); padding: var(--space-3) var(--space-4); margin-bottom: var(--space-2); background: var(--page); border: 1px solid var(--ring); border-radius: 10px; }
.totals span { display: block; color: var(--muted); font-size: var(--text-xs); }
.totals b { font-size: var(--text-xl); font-weight: 600; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
.totals b small { margin-left: var(--space-1); color: var(--muted); font-size: var(--text-sm); font-weight: 400; }
.tab-foot { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: var(--space-2) var(--space-4); margin-top: var(--space-2); color: var(--muted); font-size: var(--text-sm); }
.tab-foot .link-button { padding-left: 0; }
.card .table + .table, .card .table + h3 { margin-top: var(--space-5); }

.scope { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2); }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 2px 0 var(--space-3); border-radius: 999px; background: color-mix(in srgb, var(--accent) 12%, var(--surface)); border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent); font-size: var(--text-sm); }
.chip b { font-weight: 600; max-width: 32ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip button { border: 0; background: none; width: 22px; height: 22px; border-radius: 50%; color: var(--ink-2); font-size: 11px; }
.chip button:hover { background: var(--raised); color: var(--ink); }
.link-button { border: 0; background: none; color: var(--accent); font-size: var(--text-sm); padding: var(--space-1) var(--space-2); }
.account-line { margin: 0; color: var(--ink-2); font-size: var(--text-sm); }

.exported .topbar { margin-bottom: var(--space-1); }
#print { display: none; }
.footnote { color: var(--muted); font-size: var(--text-xs); margin-top: var(--space-6); max-width: 80ch; }

@media (max-width: 860px) {
  :root { --pad: var(--space-4); }
  .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-6) 0; }
  .pair { grid-template-columns: minmax(0, 1fr); }
  .money-row, .limits-row { grid-template-columns: minmax(0, 1fr); gap: var(--space-5); }
  .money, .limits-account { padding: 0; border-left: 0; }
  .limit-row { grid-template-columns: minmax(0, 1fr) auto; gap: var(--space-1) var(--space-3); }
  .limit-header { display: none; }
  .limit-now { grid-column: 1 / -1; grid-template-columns: minmax(48px, 1fr) 40px auto; }
  .limit-peak { grid-column: 1; }
  .tile { padding: 0 var(--space-4); }
  .tile:nth-child(odd) { padding-left: 0; border-left: 0; }
  .tile.hero .value { font-size: var(--text-2xl); }
  .tile .spark { display: none; }
  .table table { min-width: 640px; }
  .toolbar h1 { flex: 1; }
  .controls { order: 3; flex-basis: 100%; position: relative; }
  .controls > .menu { position: static; }
  .range-popover { width: min(320px, 100%); }
  .trigger { gap: 6px; padding: 0 var(--space-2); }
  .trigger .meta::before { margin-right: 6px; }
  main { padding: var(--space-5) var(--space-4) var(--space-12); }
}
@media print {
  :root:not([data-theme]), :root[data-theme] {
    color-scheme: light;
    --page: #ffffff; --surface: #ffffff; --raised: #f0efec; --hover: #f3f2ef;
    --ink: #0b0b0b; --ink-2: #52514e; --muted: #7d7b75; --grid: #e8e7e1; --axis: #c3c2b7;
    --ring: rgba(11, 11, 11, 0.12); --accent: #2a78d6;
    --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100;
    --s5: #e87ba4; --s6: #008300; --s7: #6250d6; --s8: #e34948;
    --other: #c3c2b7; --good: #0b7a50; --shadow: none;
  }
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  body { background: #fff; }
  body.printing > main, body.printing .panel, body.printing .panel-backdrop, body.printing #tip { display: none !important; }
  body.printing #print { display: block; }
  @page { size: letter; margin: 0.45in; }
  body { font-size: 10.5px; }
  #print main { max-width: none; padding: 0; }
  #print h1 { font-size: 15px; }
  #print h2 { font-size: 12.5px; }
  #print .source { margin-bottom: 10px; font-size: 10px; }
  #print .stack { gap: 10px; }
  #print .card { padding: 12px 14px; border-radius: 8px; box-shadow: none; break-inside: auto; }
  #print .card-head { margin-bottom: 8px; min-height: 0; }

  #print .summary { font-size: 11.5px; margin-bottom: 10px; padding-bottom: 10px; }
  #print .tiles { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0; }

  #print .tile:first-child { padding-left: 0; border-left: 0; }

  #print .tile.hero .value { font-size: 24px; }
  #print .tile .sub { font-size: 10px; }

  #print .spark { width: 56px; height: 20px; }
  #print .table { overflow: visible; margin: 0 -14px; }
  #print table { table-layout: auto; }
  #print col { width: auto !important; }
  #print th, #print td { height: 22px; padding: 0 6px; font-size: 10px; overflow: visible; text-overflow: clip; }
  #print th { height: 20px; font-size: 9.5px; }
  #print th:first-child, #print td:first-child { padding-left: 14px; }
  #print th:last-child, #print td:last-child { padding-right: 14px; }
  #print tr { break-inside: avoid; }
  #print tfoot { display: table-row-group; }
  #print .share { gap: 6px; }
  #print .share .track { width: 48px; flex: none; }
  #print .share em { width: auto; font-size: 10px; }
  #print .mix { width: 90px; height: 6px; margin-left: auto; }
  #print .chart svg { max-height: 190px; }
  #print .footnote { font-size: 9px; margin-top: 12px; }
}
</style>

<body>
<main>
<header class="topbar toolbar">
  <h1>Gigawatts</h1>
  <div class="controls">
    <div class="menu" id="account-picker">
      <button class="trigger" id="account-button" type="button" aria-haspopup="menu" aria-expanded="false" aria-label="Account"><span class="value">Loading…</span></button>
      <div class="popover" id="account-menu" role="menu" aria-label="Account"></div>
    </div>
    <div class="menu">
      <button class="trigger" id="range-button" type="button" aria-haspopup="menu" aria-expanded="false" aria-label="Range"><span class="value">Loading…</span></button>
      <div class="popover range-popover" id="range-menu" role="menu" aria-label="Range">
        <div id="range-items"></div>
        <hr>
        <form class="custom-range" id="custom-range">
          <p class="popover-label">Custom range</p>
          <label>From<input type="date" id="since" required></label>
          <label>To<input type="date" id="until" required></label>
          <button class="button primary" type="submit">Show range</button>
        </form>
      </div>
    </div>
    <div class="scope" id="scope" aria-label="Focused on"></div>
  </div>
  <div class="menu">
    <button class="trigger" id="theme-button" type="button" aria-haspopup="menu" aria-expanded="false" aria-label="Theme"></button>
    <div class="popover end" id="theme-menu" role="menu" aria-label="Theme"></div>
  </div>
  <div class="menu">
    <button class="trigger" id="export" type="button" aria-haspopup="menu" aria-expanded="false"></button>
    <div class="popover end" id="export-menu" role="menu">
      <p class="menu-note">A summary of this view: totals, models, skills, and subagents, without repo, branch, or session names.</p>
      <button class="rich" type="button" role="menuitem" data-export="markdown"><span>Markdown</span><small>Text and tables, for Slack, GitHub, Linear, or an agent</small></button>
      <button class="rich" type="button" role="menuitem" data-export="pdf"><span>PDF</span><small>With charts, through the print dialog</small></button>
    </div>
  </div>
</header>
<p class="source" id="source">Loading from the history database…</p>
<div class="problems" id="problems" role="status" hidden></div>
<div class="stack" id="content"></div>
</main>
<div class="panel-backdrop" id="backdrop"></div>
<aside class="panel" id="panel" aria-label="Details" aria-hidden="true"></aside>
<div id="print"></div>
<div id="tip" role="tooltip"></div>
<script>
const RANGES = [['week', 'This week'], ['month', 'This month'], ['lastmonth', 'Last month'], ['all', 'All time'], ['custom', 'Custom']];
const GROUP_NAMES = {repo: 'Repo', branch: 'Branch', skill: 'Skill', agent: 'Subagent', model: 'Model'};
const NEXT = {
  none: ['repo', 'skill', 'agent', 'model'],
  repo: ['branch', 'skill', 'model', 'agent'],
  branch: ['skill', 'model', 'agent'],
  skill: ['repo', 'model', 'agent'],
  model: ['repo', 'skill', 'agent'],
  agent: ['model', 'repo', 'skill'],
};
const SCOPE_OF_LEVEL = {repo: 'repo', repo_branch: 'branch', skill: 'skill', agent: 'agent', model: 'model'};
const CHART_BY = [['repo', 'Repo'], ['model', 'Model']];
const LEVEL_NAMES = {repo: 'Repo', branch: 'Branch', repo_branch: 'Branch', skill: 'Skill', agent: 'Subagent', model: 'Model', session: 'Session'};
const SLOTS = ['--s1', '--s2', '--s3', '--s4', '--s5', '--s6', '--s7', '--s8'];
const ACCOUNT_SLOTS = ['--s1', '--s5', '--s4', '--s7', '--s2', '--s3', '--s6', '--s8'];
const MIX_PARTS = [['input_usd', 'Input', '--other'], ['output_usd', 'Output', '--s2'], ['cache_write_usd', 'Cache writes', '--s7'], ['cache_read_usd', 'Cache reads', '--s3']];
const ALL = 'all';
const SVG_NS = 'http://www.w3.org/2000/svg';
const DAY_MS = 86400000;
const FOLD_KEEP = 7;
const EXPORT_FOLD_SHARE = 0.01;
const EXPORT_FOLD_MIN_ROWS = 8;
const PANEL_ROWS = 6;
const PANEL_SESSIONS = 5;
const PANEL_CHART_WIDTH = 392;
const PAGE_SESSIONS = 5;
const MIN_CHART_WIDTH = 280;
const DAY_LABEL_GAP = 48;
const MONTH_LABEL_GAP = 64;
const BRANCH_SEPARATOR = '\u001f';
const NOT_IN_TRANSCRIPTS = 'Not in transcripts';
const tip = document.getElementById('tip');

let state = readState();
let latest = null;
let loadedHash = null;
const expanded = new Set();
let panelToken = 0;
let breakdownRequest = 0;
let chartRequest = 0;
let insightsRequest = null;
let insightsAnswer = null;
let insightsError = null;

function readState() {
  const params = new URLSearchParams(location.hash.slice(1));
  const pick = (name, options, fallback) => options.some(([value]) => value === params.get(name)) ? params.get(name) : fallback;
  const scope = params.getAll('scope').map(entry => {
    const split = entry.indexOf(':');
    const kind = entry.slice(0, split);
    const key = entry.slice(split + 1);
    return {kind, key, label: scopeLabel(kind, key)};
  }).filter(item => Object.hasOwn(GROUP_NAMES, item.kind) && item.key);
  return {
    account: params.get('account') || '',
    range: pick('range', RANGES, 'month'),
    since: params.get('since') || '',
    until: params.get('until') || '',
    by: Object.hasOwn(GROUP_NAMES, params.get('by') ?? '') ? params.get('by') : 'repo',
    chart: ['account', 'repo', 'model'].includes(params.get('chart')) ? params.get('chart') : null,
    scope,
  };
}

function scopeLabel(kind, key) {
  if (kind === 'repo') return key.split('/').filter(Boolean).at(-1) ?? key;
  if (kind === 'branch') return key.split(BRANCH_SEPARATOR).slice(1).join(BRANCH_SEPARATOR) || key;
  if (kind === 'skill') return skillName(key);
  if (kind === 'agent') return key === 'main conversation' ? 'You (no subagent)' : key;
  if (kind === 'model') return prettyModel(key);
  return key;
}

function defaultAccount(accounts) {
  return accounts.length > 1 ? ALL : accounts[0]?.account ?? ALL;
}

function accountParam() {
  const accounts = latest?.now.accounts ?? [];
  if (!state.account || state.account === defaultAccount(accounts)) return null;
  if (state.account === ALL) return ALL;
  const found = accounts.find(account => account.account === state.account);
  if (!found) return state.account;
  const name = slug(found.account_label ?? '');
  const unique = accounts.filter(account => slug(account.account_label ?? '') === name).length === 1;
  return name && unique ? name : found.account;
}

function addressValue(value) {
  return encodeURIComponent(value).replace(/%2F/g, '/').replace(/%3A/g, ':');
}

function stateHash() {
  const parts = [];
  const add = (name, value) => parts.push(`${name}=${addressValue(value)}`);
  const account = accountParam();
  if (account) add('account', account);
  if (state.range !== 'month') add('range', state.range);
  if (state.range === 'custom') {
    if (state.since) add('since', state.since);
    if (state.until) add('until', state.until);
  }
  if (state.by !== 'repo') add('by', state.by);
  if (state.chart) add('chart', state.chart);
  for (const item of state.scope) add('scope', `${item.kind}:${item.key}`);
  return parts.length ? '#' + parts.join('&') : '';
}

function writeState() {
  history.replaceState(null, '', stateHash() || location.pathname);
}

function navigate() {
  closePanel();
  expanded.clear();
  history.pushState(null, '', stateHash() || location.pathname);
  load();
}

function scopedKinds() {
  const kinds = new Set(state.scope.map(item => item.kind));
  if (kinds.has('branch')) kinds.add('repo');
  return kinds;
}

function primaryScope() {
  return state.scope.at(-1)?.kind ?? 'none';
}

function groupings() {
  const taken = scopedKinds();
  return NEXT[primaryScope()].filter(kind => !taken.has(kind));
}

function breakdownGrouping() {
  const options = groupings();
  return options.includes(state.by) ? state.by : options[0] ?? 'model';
}

function defaultChart() {
  return state.account === ALL ? 'account' : 'repo';
}

function chartGrouping() {
  if (state.scope.length) return groupings()[0] ?? 'model';
  const chart = state.chart ?? defaultChart();
  return chart === 'account' && state.account !== ALL ? 'repo' : chart;
}

function chartOptions() {
  return state.account === ALL ? [['account', 'Account'], ...CHART_BY] : CHART_BY;
}

function chartName(by) {
  return by === 'account' ? 'Account' : GROUP_NAMES[by];
}

function seriesBy(chart) {
  return chart === 'account' ? 'repo' : chart;
}

function seriesMissing() {
  const chart = chartGrouping();
  return chart !== 'account' && latest.seriesBy !== chart;
}

function pickChart(chart) {
  state.chart = chart === defaultChart() ? null : chart;
  if (seriesMissing()) loadChart();
  else render();
}

function accountName(id) {
  return latest.now.accounts.find(account => account.account === id)?.account_label ?? 'No account';
}

function accountColor(id) {
  const index = latest.now.accounts.findIndex(account => account.account === id);
  return index === -1 ? 'var(--other)' : `var(${ACCOUNT_SLOTS[index % ACCOUNT_SLOTS.length]})`;
}

function byAccount(entries) {
  return entries.map(entry => ({day: entry.day, key: entry.account ?? '', label: accountName(entry.account), not_in_transcript: false, other: false, cost_usd: entry.cost_usd}));
}

function scopeParams(params, extra = []) {
  for (const item of [...state.scope, ...extra]) params.append(item.kind, item.key);
  return params;
}

function scopeTitle() {
  return state.scope.map(item => item.label).join(' · ');
}

function focusOn(item) {
  state.scope = [...state.scope.filter(existing => existing.kind !== item.kind), item];
  navigate();
}

function unfocus(kind) {
  state.scope = state.scope.filter(item => item.kind !== kind && !(kind === 'repo' && item.kind === 'branch'));
  navigate();
}

function localDay(date = new Date()) {
  const pad = number => String(number).padStart(2, '0');
  return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}`;
}

function lastMonthBounds(today) {
  const year = Number(today.slice(0, 4));
  const month = Number(today.slice(5, 7));
  const previousYear = month === 1 ? year - 1 : year;
  const previousMonth = month === 1 ? 12 : month - 1;
  const days = new Date(Date.UTC(previousYear, previousMonth, 0)).getUTCDate();
  const pad = number => String(number).padStart(2, '0');
  return {
    since: `${previousYear}-${pad(previousMonth)}-01`,
    until: `${previousYear}-${pad(previousMonth)}-${pad(days)}`,
    sameDay: `${previousYear}-${pad(previousMonth)}-${pad(Math.min(Number(today.slice(8, 10)), days))}`,
    name: new Date(Date.UTC(previousYear, previousMonth - 1, 1)).toLocaleDateString(undefined, {month: 'long', timeZone: 'UTC'}),
  };
}

function rangeParams() {
  const params = new URLSearchParams();
  if (state.range === 'lastmonth') {
    const last = lastMonthBounds(localDay());
    params.set('since', last.since);
    params.set('until', last.until);
  } else if (state.range !== 'custom') {
    params.set('range', state.range);
  } else if (state.since || state.until) {
    if (state.since) params.set('since', state.since);
    if (state.until) params.set('until', state.until);
  } else {
    params.set('range', 'all');
  }
  return params;
}

function element(tag, text, className) {
  const node = document.createElement(tag);
  if (text !== undefined && text !== null) node.textContent = text;
  if (className) node.className = className;
  return node;
}

function svg(tag, attributes) {
  const node = document.createElementNS(SVG_NS, tag);
  for (const [name, value] of Object.entries(attributes)) node.setAttribute(name, value);
  return node;
}

function dollars(value, digits = 2) {
  return '$' + value.toLocaleString(undefined, {minimumFractionDigits: digits, maximumFractionDigits: digits});
}

function money(value) {
  return Math.abs(value) >= 100 ? dollars(value, 0) : dollars(value);
}

function compact(value) {
  return value.toLocaleString(undefined, {notation: 'compact', maximumFractionDigits: 1});
}

function percent(value) {
  return Math.round(value) + '%';
}

function shareText(fraction) {
  return fraction > 0 && fraction < 0.005 ? '<1%' : percent(fraction * 100);
}

function addDays(day, count) {
  const date = new Date(day + 'T00:00:00Z');
  date.setUTCDate(date.getUTCDate() + count);
  return date.toISOString().slice(0, 10);
}

function dayCount(first, last) {
  return Math.round((Date.parse(last + 'T00:00:00Z') - Date.parse(first + 'T00:00:00Z')) / DAY_MS) + 1;
}

function daysBetween(first, last) {
  const days = [];
  for (let day = first; day <= last && days.length < 3700; day = addDays(day, 1)) days.push(day);
  return days;
}

function isWeekday(day) {
  const weekday = new Date(day + 'T00:00:00Z').getUTCDay();
  return weekday >= 1 && weekday <= 5;
}

function shortDate(day) {
  return new Date(day + 'T00:00:00Z').toLocaleDateString(undefined, {month: 'short', day: 'numeric', timeZone: 'UTC'});
}

function updatedLine(at) {
  const time = at.toLocaleTimeString([], {hour: 'numeric', minute: '2-digit'});
  if (at.toDateString() === new Date().toDateString()) return `Updated ${time}`;
  return `Updated ${at.toLocaleDateString([], {month: 'short', day: 'numeric'})}, ${time}`;
}

function longDate(ms) {
  return new Date(ms).toLocaleDateString(undefined, {weekday: 'short', month: 'short', day: 'numeric'});
}

function localTime(ms) {
  return new Date(ms).toLocaleString(undefined, {weekday: 'short', hour: 'numeric', minute: '2-digit'});
}

function minutes(value) {
  return value >= 90 ? `${(value / 60).toFixed(1)} h` : `${value} min`;
}

function tabs(options, current, onPick, label, className = 'tabs') {
  const group = element('div', undefined, className);
  group.setAttribute('role', 'group');
  group.setAttribute('aria-label', label);
  group.dataset.control = 'true';
  for (const [value, text] of options) {
    const button = element('button', text);
    button.type = 'button';
    button.setAttribute('aria-pressed', String(value === current));
    button.addEventListener('click', () => onPick(value));
    group.append(button);
  }
  return group;
}

function resetTree() {
  expanded.clear();
}

  stack: 'M8 2.5l5.5 3L8 8.5l-5.5-3zM2.5 8.5L8 11.5l5.5-3M2.5 11L8 14l5.5-3',
