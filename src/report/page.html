const popovers = [];

function setupPopover(trigger, panel) {
  popovers.push({trigger, panel});
  trigger.parentElement.addEventListener('focusout', event => {
    if (event.relatedTarget && !trigger.parentElement.contains(event.relatedTarget)) closePopover(trigger, panel);
  });
  trigger.addEventListener('click', () => {
    const opening = !panel.classList.contains('open');
    closeMenu();
    if (!opening) return;
    panel.classList.add('open');
    trigger.setAttribute('aria-expanded', 'true');
    (panel.querySelector('[aria-checked="true"]') ?? menuItems(panel)[0])?.focus();
  });
  panel.addEventListener('keydown', event => {
    if (event.key === 'Escape') {
      event.stopPropagation();
      closeMenu();
      trigger.focus();
      return;
    }
    const items = menuItems(panel);
    const at = items.indexOf(document.activeElement);
    const next = {ArrowDown: at + 1, ArrowUp: at - 1, Home: 0, End: items.length - 1}[event.key];
    if (next === undefined || at === -1 && !['Home', 'End'].includes(event.key)) return;
    event.preventDefault();
    items[(next + items.length) % items.length]?.focus();
  });
}

function menuItems(panel) {
  return [...panel.querySelectorAll('[role^="menuitem"]')];
}

function closePopover(trigger, panel) {
  panel.classList.remove('open');
  trigger.setAttribute('aria-expanded', 'false');
}

function closeMenu() {
  for (const {trigger, panel} of popovers) closePopover(trigger, panel);
}

document.addEventListener('click', event => { if (!event.target.closest('.menu')) closeMenu(); });
setupPopover(document.getElementById('account-button'), document.getElementById('account-menu'));
setupPopover(document.getElementById('range-button'), document.getElementById('range-menu'));

function forAccount(items) {
  return state.account === ALL ? items : items.filter(item => item.account === state.account);
}

function rowId(row) {
  return (row.not_in_transcript ? 'u:' : '') + (row.key ?? '');
}

function mergeRows(rows) {
  const merged = new Map();
  for (const row of rows) {
    const id = rowId(row);
    const into = merged.get(id);
    if (!into) { merged.set(id, {...row}); continue; }
    for (const field of ['requests', 'input_tokens', 'output_tokens', 'cache_read_tokens', 'cache_write_tokens']) into[field] += row[field];
    into.cost_usd = (into.cost_usd ?? 0) + (row.cost_usd ?? 0);
  }
  return [...merged.values()].sort((a, b) => (b.cost_usd ?? 0) - (a.cost_usd ?? 0));
}

function mergeMix(rows) {
  const merged = new Map();
  for (const row of rows) {
    const id = rowId(row);
    const into = merged.get(id) ?? {sessions: 0, session_cost_usd: null, input_usd: 0, output_usd: 0, cache_write_usd: 0, cache_read_usd: 0};
    for (const field of ['sessions', 'input_usd', 'output_usd', 'cache_write_usd', 'cache_read_usd']) into[field] += row[field];
    if (row.session_cost_usd != null) into.session_cost_usd = (into.session_cost_usd ?? 0) + row.session_cost_usd;
    merged.set(id, into);
  }
  return merged;
}

function foldMix(rows, mix) {
  return mergeMix(rows.map(row => mix.get(rowId(row))).filter(Boolean).map(entry => ({...entry, key: 'folded tail', not_in_transcript: false}))).get('folded tail')
    ?? {sessions: 0, session_cost_usd: null, input_usd: 0, output_usd: 0, cache_write_usd: 0, cache_read_usd: 0};
}

function perSession(row, mix) {
  const count = mix?.sessions ?? 0;
  return count ? money((mix.session_cost_usd ?? row.cost_usd ?? 0) / count) : '';
}

function cost(rows) {
  return rows.reduce((sum, row) => sum + (row.cost_usd ?? 0), 0);
}

function prettyModel(label) {
  const match = /^claude-([a-z]+)-(\d+)(?:-(\d))?(?:-\d{8})?(.*)$/.exec(label);
  if (!match) return label;
  const [, family, major, minor, rest] = match;
  return `${family[0].toUpperCase()}${family.slice(1)} ${major}${minor ? '.' + minor : ''}${rest}`;
}

function rowName(row, level) {
  if (level === 'repo_branch' && row.key) return row.key.split(BRANCH_SEPARATOR).slice(1).join(BRANCH_SEPARATOR);
  if (level === 'skill' && row.key === 'no skill') return 'Plain conversation';
  if (level === 'agent' && row.key === 'main conversation') return 'You (no subagent)';
  if (row.not_in_transcript && !row.key) return NOT_IN_TRANSCRIPTS;
  const label = level === 'model' ? prettyModel(row.label) : row.label;
  if (row.not_in_transcript && (level === 'model' || level === 'session')) return label + ', not in transcripts';
  return label;
}

function agentName(label) {
  return label === 'you (no subagent)' ? 'You (no subagent)' : label;
}

function skillName(label) {
  return label === 'no skill' ? 'Plain conversation' : label;
}

function seriesId(entry) {
  if (entry.other) return 'other';
  return (entry.not_in_transcript ? 'u:' : '') + (entry.key ?? '');
}

function seriesLabel(entry) {
  if (entry.other) return 'Other';
  if (entry.not_in_transcript && !entry.key) return NOT_IN_TRANSCRIPTS;
  if (entry.key?.includes(BRANCH_SEPARATOR)) return entry.key.split(BRANCH_SEPARATOR).slice(1).join(BRANCH_SEPARATOR);
  const label = prettyModel(entry.label);
  return entry.not_in_transcript ? label + ', not in transcripts' : label;
}

function seriesColors(entries) {
  const totals = new Map();
  const labels = new Map();
  for (const entry of entries) {
    const id = seriesId(entry);
    totals.set(id, (totals.get(id) || 0) + entry.cost_usd);
    labels.set(id, seriesLabel(entry));
  }
  const ranked = [...totals.keys()].filter(id => id !== 'other').sort((a, b) => totals.get(b) - totals.get(a));
  const order = ranked.slice(0, SLOTS.length);
  const folded = ranked.slice(SLOTS.length);
  if (folded.length || totals.has('other')) {
    totals.set('other', (totals.get('other') || 0) + folded.reduce((sum, id) => sum + totals.get(id), 0));
    labels.set('other', 'Other');
    order.push('other');
  }
  const colors = new Map(order.map((id, index) => [id, id === 'other' ? 'var(--other)' : `var(${SLOTS[index]})`]));
  return {order, colors, totals, labels};
}

function niceStep(max) {
  const rough = max / 4;
  const power = Math.pow(10, Math.floor(Math.log10(rough)));
  return [1, 2, 2.5, 5, 10].map(step => step * power).find(step => step >= rough);
}

function multiple(ratio) {
  return ratio >= 2 ? `${ratio.toFixed(ratio >= 10 ? 0 : 1)}×` : `${ratio >= 1 ? '+' : '−'}${percent(Math.abs(ratio - 1) * 100)}`;
}

// Headline

function tile(label, value, subs, options = {}) {
  const box = element(options.onClick ? 'button' : 'div', undefined, 'tile' + (options.hero ? ' hero' : '') + (options.onClick ? ' link' : ''));
  if (options.onClick) { box.type = 'button'; box.addEventListener('click', options.onClick); }
  box.append(element('span', label, 'label'));
  const valueRow = element('div', undefined, 'value-row');
  valueRow.append(element('span', value, 'value'));
  if (options.spark) valueRow.append(options.spark);
  box.append(valueRow);
  if (options.meter !== undefined) box.append(meter(options.meter, options.expected, options.elsewhere));
  for (const sub of subs.filter(Boolean)) {
    const [text, className] = Array.isArray(sub) ? sub : [sub, ''];
    box.append(element('span', text, 'sub ' + className));
  }
  return box;
}

function meter(fraction, expected, elsewhere) {
  const level = fraction >= 0.9 ? 'critical' : fraction >= 0.75 ? 'warning' : '';
  const bar = element('div', undefined, 'meter ' + level);
  bar.setAttribute('role', 'meter');
  bar.setAttribute('aria-valuenow', String(Math.round(fraction * 100)));
  const fill = element('span');
  fill.style.width = Math.min(100, fraction * 100) + '%';
  bar.append(fill);
  if (elsewhere) {
    const shade = element('b');
    shade.style.left = Math.min(100, (fraction - elsewhere) * 100) + '%';
    shade.style.width = Math.min(100, elsewhere * 100) + '%';
    bar.append(shade);
  }
  if (expected !== undefined) {
    const mark = element('i');
    mark.style.left = `calc(${Math.min(100, expected * 100)}% - 1px)`;
    bar.append(mark);
  }
  return bar;
}

function sparkline(values) {
  if (values.length < 2 || values.length > 120) return null;
  const width = 88, height = 30, max = Math.max(...values, 0.01);
  const x = index => index / (values.length - 1) * (width - 6) + 3;
  const y = value => height - 4 - value / max * (height - 8);
  const root = svg('svg', {viewBox: `0 0 ${width} ${height}`, width, height, class: 'spark', 'aria-hidden': 'true'});
  root.append(svg('polyline', {points: values.map((value, index) => `${x(index)},${y(value)}`).join(' '), fill: 'none', stroke: 'var(--muted)', 'stroke-width': 1.5, 'stroke-linejoin': 'round', 'stroke-linecap': 'round'}));
  root.append(svg('circle', {cx: x(values.length - 1), cy: y(values[values.length - 1]), r: 3, fill: 'var(--accent)'}));
  return root;
}

function monthNumbers(view) {
  const monthSpend = view.month.filter(day => day.day <= view.today).reduce((sum, day) => sum + day.cost_usd, 0);
  const dayOfMonth = Number(view.today.slice(8, 10));
  const daysInMonth = new Date(Date.UTC(Number(view.today.slice(0, 4)), Number(view.today.slice(5, 7)), 0)).getUTCDate();
  return {monthSpend, pace: monthSpend / dayOfMonth * daysInMonth};
}

function creditsOf(view) {
  const limits = view.now?.limits;
  const credits = limits?.limits.find(limit => limit.kind === 'credits' && limit.credits?.limit);
  if (!credits) return null;
  const {used, limit: cap} = credits.credits;
  const left = Math.max(0, cap - used);
  const resetMs = credits.pace?.window_end_ms ?? null;
  let runOutMs = credits.forecast?.full_at_ms ?? null;
  if (!runOutMs && credits.pace) {
    const elapsedDays = Math.max(1, (limits.fetched_at_ms - credits.pace.window_start_ms) / DAY_MS);
    const perDay = used / elapsedDays;
    const projected = perDay > 0 ? limits.fetched_at_ms + left / perDay * DAY_MS : null;
    if (projected !== null && (resetMs === null || projected >= resetMs)) runOutMs = projected;
  }
  return {limit: credits, limits, used, cap, left, runOutMs, resetMs, runsOutFirst: runOutMs !== null && resetMs !== null && runOutMs < resetMs};
}

function closestLimit(view) {
  const limits = view.now?.limits;
  const limit = limits?.limits.filter(entry => entry.kind !== 'credits').sort((a, b) => b.percent - a.percent)[0];
  return limit ? {limit, limits} : null;
}

function limitName(limit) {
  return {session: 'Session limit', weekly_all: 'Weekly limit', weekly_scoped: 'Weekly limit, ' + (limit.scope ?? ''), credits: 'Credits'}[limit.kind] ?? limit.kind;
}

function headedFor(limit, fetchedAtMs) {
  const pace = limit.pace;
  if (!pace) return null;
  const elapsed = (fetchedAtMs - pace.window_start_ms) / (pace.window_end_ms - pace.window_start_ms);
  if (elapsed < 0.1 || limit.percent <= 0) return null;
  return limit.percent / elapsed;
}

function limitAge(limits) {
  const elapsed = Math.round((Date.now() - limits.fetched_at_ms) / 60000);
  const age = elapsed < 1 ? 'just now' : elapsed < 60 ? `${elapsed} min ago` : `${Math.round(elapsed / 60)} h ago`;
  const source = limits.source === 'get_usage' ? 'get_usage' : 'cachedUsageUtilization';
  return `${source}, ${age}`;
}

function summary(view) {
  const sentences = [];
  const {monthSpend, pace} = monthNumbers(view);
  let month = `On pace for about ${money(pace)} this month`;
  if (view.lastMonth && view.lastMonth.spend > 0) {
    const ratio = monthSpend / view.lastMonth.spend;
    const then = `${view.lastMonth.name} by this point (${money(view.lastMonth.spend)})`;
    month += ratio >= 2
      ? `, ${ratio.toFixed(ratio >= 10 ? 0 : 1)}× ${then}`
      : `, ${percent(Math.abs(ratio - 1) * 100)} ${ratio >= 1 ? 'more' : 'less'} than ${then}`;
  }
  sentences.push(month + '.');
  const credits = creditsOf(view);
  if (credits?.runOutMs) {
    sentences.push(credits.runsOutFirst
      ? `At this rate credits run out about ${longDate(credits.runOutMs)}, before the reset on ${longDate(credits.resetMs)}.`
      : `At this rate credits last past the reset on ${longDate(credits.resetMs ?? credits.runOutMs)}.`);
  }
  const closest = closestLimit(view);
  if (closest?.limit.forecast) {
    sentences.push(`${limitName(closest.limit)} reaches 100% by ${localTime(closest.limit.forecast.full_at_ms)}${recentPace(closest.limit.forecast)}, before it resets.`);
  } else if (closest) {
    const headed = headedFor(closest.limit, closest.limits.fetched_at_ms);
    if (headed !== null) sentences.push(`${limitName(closest.limit)} is headed for about ${percent(Math.min(headed, 999))} at its reset.`);
  }
  return sentences.join(' ');
}

function pastHeadline(view) {
  const card = element('section', undefined, 'card');
  card.setAttribute('aria-label', 'Headline numbers');
  const byDay = new Map();
  for (const entry of view.series) byDay.set(entry.day, (byDay.get(entry.day) || 0) + entry.cost_usd);
  const days = daysBetween(view.first, view.last);
  const spend = cost(view.rows);
  const active = days.filter(day => (byDay.get(day) || 0) > 0);
  const busiest = days.reduce((best, day) => (byDay.get(day) || 0) > (byDay.get(best) || 0) ? day : best, days[0]);
  const sentence = element('p', undefined, 'summary');
  sentence.append(element('span', `${view.period}: ${money(spend)} over ${days.length} days, ${money(spend / days.length)} a day on average${active.length < days.length ? `, or ${money(active.length ? spend / active.length : 0)} on each of the ${active.length} days with any spend` : ''}.`));
  card.append(sentence);
  const tiles = element('div', undefined, 'tiles');
  tiles.append(spendTile(view));
  tiles.append(tile('Average active day', money(active.length ? spend / active.length : 0), [`${active.length} of ${days.length} days had spend`]));
  if (busiest && byDay.get(busiest)) tiles.append(tile('Busiest day', money(byDay.get(busiest)), [new Date(busiest + 'T00:00:00Z').toLocaleDateString(undefined, {weekday: 'long', month: 'short', day: 'numeric', timeZone: 'UTC'}), [`${percent(byDay.get(busiest) / spend * 100)} of the range`, 'faint']]));
  const driver = driverTile(view, true);
  if (driver) tiles.append(driver);
  card.append(tiles);
  return card;
}

function cacheReuse(rows) {
  const read = rows.reduce((sum, row) => sum + row.cache_read_tokens, 0);
  const all = rows.reduce((sum, row) => sum + row.input_tokens + row.cache_read_tokens + row.cache_write_tokens, 0);
  return all > 0 ? read / all : null;
}

function sessionTile(view, spend) {
  const count = view.sessionCount;
  if (!count) return null;
  const partial = view.keptFrom && view.keptFrom > view.first;
  const sessionSpend = partial ? view.series.filter(entry => entry.day >= view.keptFrom).reduce((sum, entry) => sum + entry.cost_usd, 0) : spend;
  return tile('Sessions', count.toLocaleString(), [`${money(sessionSpend / count)} per session`, partial ? [`Counted from ${shortDate(view.keptFrom)}, when session detail starts`, 'faint'] : null]);
}

function summaryHeadline(view) {
  const card = element('section', undefined, 'card');
  card.setAttribute('aria-label', 'Headline numbers');
  const spend = cost(view.rows);
  const byDay = new Map();
  for (const entry of view.series) byDay.set(entry.day, (byDay.get(entry.day) || 0) + entry.cost_usd);
  const days = daysBetween(view.first, view.last);
  const active = days.filter(day => (byDay.get(day) || 0) > 0);
  const perActive = active.length ? spend / active.length : 0;
  const busiest = active.reduce((best, day) => best === null || byDay.get(day) > byDay.get(best) ? day : best, null);
  const accountSpend = view.accountRows ? cost(view.accountRows) : 0;
  const reuse = cacheReuse(view.rows);
  const sentences = [`${state.scope.length ? scopeTitle() + ': ' : ''}${money(spend)} over ${days.length} ${days.length === 1 ? 'day' : 'days'}, with spend on ${active.length} of them (${money(perActive)} per active day).`];
  if (state.scope.length && accountSpend > 0) sentences.push(`That is ${shareText(spend / accountSpend)} of the account's spend in the same days.`);
  if (reuse !== null) sentences.push(`${percent(reuse * 100)} of the input Claude read came from the prompt cache, which costs far less than fresh input.`);
  const sentence = element('p', undefined, 'summary');
  sentence.append(element('span', sentences.join(' ')));
  card.append(sentence);
  const tiles = element('div', undefined, 'tiles');
  tiles.append(spendTile(view));
  tiles.append(tile('Active days', `${active.length} of ${days.length}`, [`${money(perActive)} per active day`, busiest ? [`Busiest: ${shortDate(busiest)}, ${money(byDay.get(busiest))}`, 'faint'] : null]));
  const sessions = sessionTile(view, spend);
  if (sessions) tiles.append(sessions);
  const credits = view.last >= view.today ? creditsOf(view) : null;
  if (credits) tiles.append(creditsTile(credits));
  else if (reuse !== null) tiles.append(tile('Cache reuse', percent(reuse * 100), ['Share of input read from the cache', ['Higher means cheaper input', 'faint']]));
  card.append(tiles);
  return card;
}

function scopedHeadline(view) {
  const card = element('section', undefined, 'card');
  card.setAttribute('aria-label', 'Headline numbers');
  const spend = cost(view.rows);
  const accountSpend = view.accountRows ? cost(view.accountRows) : 0;
  const days = dayCount(view.first, view.last);
  const share = accountSpend > 0 ? spend / accountSpend : null;
  const sentence = element('p', undefined, 'summary');
  sentence.append(element('span', `${scopeTitle()}: ${money(spend)} over ${days} ${days === 1 ? 'day' : 'days'}${share !== null ? `, ${shareText(share)} of the account's spend in this range` : ''}.`));
  card.append(sentence);
  const tiles = element('div', undefined, 'tiles');
  tiles.append(spendTile(view));
  if (share !== null) tiles.append(tile('Share of account', shareText(share), [`${money(accountSpend)} for the account in this range`]));
  const sessions = sessionTile(view, spend);
  if (sessions) tiles.append(sessions);
  const reuse = cacheReuse(view.rows);
  if (reuse !== null) tiles.append(tile('Cache reuse', percent(reuse * 100), ['Share of input read from the cache', ['Higher means cheaper input', 'faint']]));
  card.append(tiles);
  return card;
}

function accountLine(view) {
  if (view.last < view.today) return null;
  const {monthSpend, pace} = monthNumbers(view);
  const parts = [`${view.accountLabel ?? 'All accounts'}: ${money(monthSpend)} this month, on pace for about ${money(pace)}`];
  const credits = creditsOf(view);
  const closest = closestLimit(view);
  if (credits) parts.push(`credits ${percent(credits.used / credits.cap * 100)} used, ${dollars(credits.left, 0)} left`);
  else if (closest) parts.push(`${limitName(closest.limit).toLowerCase()} at ${percent(closest.limit.percent)}`);
  return element('p', parts.join(' · ') + '.', 'account-line');
}

function headline(view, shareable) {
  if (view.last < view.today) return pastHeadline(view);
  const card = element('section', undefined, 'card');
  card.setAttribute('aria-label', 'Headline numbers');
  const sentence = element('p', undefined, 'summary');
  sentence.append(element('span', summary(view)));
  card.append(sentence);
  const tiles = element('div', undefined, 'tiles');
  tiles.append(spendTile(view));
  const credits = creditsOf(view);
  const closest = closestLimit(view);
  if (credits) {
    tiles.append(creditsTile(credits), weekdayTile(credits, view));
  } else if (closest) {
    tiles.append(limitTile(closest), todayTile(view.now, shareable));
  } else {
    const {monthSpend, pace} = monthNumbers(view);
    tiles.append(tile('This month', money(monthSpend), [`On pace for about ${money(pace)}`, ['Straight line from the days so far', 'faint']]));
  }
  const driver = driverTile(view, shareable);
  if (driver) tiles.append(driver);
  card.append(tiles);
  return card;
}

function spendTile(view) {
  const spend = cost(view.rows);
  const subs = [];
  if (view.previousLabel) {
    const previous = cost(view.previousRows);
    if (previous > 0) {
      const ratio = spend / previous;
      subs.push([`${multiple(ratio)} vs ${view.previousLabel}`, 'delta ' + (ratio >= 1 ? 'up' : 'down')]);
      subs.push([`${money(previous)} then`, 'faint']);
    } else {
      subs.push([`Nothing in ${view.previousLabel}`, 'faint']);
    }
  } else if (view.historyStart) {
    subs.push([`No comparison: history starts ${shortDate(view.historyStart)}`, 'faint']);
  }
  const byDay = new Map();
  for (const entry of view.series) byDay.set(entry.day, (byDay.get(entry.day) || 0) + entry.cost_usd);
  const values = daysBetween(view.first, view.last).map(day => byDay.get(day) || 0);
  return tile('Spend', money(spend), subs, {hero: true, spark: sparkline(values)});
}

function creditsTile(credits) {
  const {limit, limits, used, cap, left, runOutMs, resetMs, runsOutFirst} = credits;
  const subs = [`${dollars(left, 0)} left of ${dollars(cap, 0)}`];
  if (limit.elsewhere_usd) subs.push(`${dollars(limit.elsewhere_usd, 0)} used elsewhere`);
  if (runOutMs) subs.push(runsOutFirst ? [`Runs out about ${longDate(runOutMs)}`, 'status-line warning'] : `Lasts past the reset, ${longDate(resetMs ?? runOutMs)}`);
  if (limit.pace) subs.push([`Mark shows even pace (${percent(limit.pace.expected_percent)})`, 'faint']);
  subs.push([`From ${limitAge(limits)}`, 'faint']);
  return tile('Credits used', dollars(used, 0), subs, {meter: used / cap, expected: limit.pace ? limit.pace.expected_percent / 100 : undefined, elsewhere: limit.elsewhere_usd ? limit.elsewhere_usd / cap : undefined});
}

function weekdayTile(credits, view) {
  const end = credits.resetMs ? localDay(new Date(credits.resetMs - 1)) : view.today;
  const remaining = daysBetween(view.today, end).filter(isWeekday);
  const past = view.month.filter(day => day.day < view.today && isWeekday(day.day));
  const average = past.length ? past.reduce((sum, day) => sum + day.cost_usd, 0) / past.length : null;
  if (!remaining.length) return tile('Per weekday left', dollars(credits.left, 0), ['No weekdays left before the reset']);
  const perDay = credits.left / remaining.length;
  const subs = [`Over the ${remaining.length} weekdays to the reset`];
  if (average !== null) {
    subs.push(perDay >= average
      ? `Room to spare: you average ${dollars(average, 0)}`
      : [`Over budget: you average ${dollars(average, 0)}`, 'status-line warning']);
  }
  subs.push(['Weekdays are Monday to Friday', 'faint']);
  return tile('Per weekday left', dollars(perDay, 0), subs);
}

function recentPace(forecast) {
  return forecast.basis === 'recent' ? " at the last 30m's pace" : '';
}

function limitTile({limit, limits}) {
  const subs = [];
  const headed = headedFor(limit, limits.fetched_at_ms);
  if (limit.forecast) subs.push([`100% by ${localTime(limit.forecast.full_at_ms)}${recentPace(limit.forecast)}`, 'status-line critical']);
  else if (headed !== null) subs.push(headed >= 100 ? [`Headed past 100% before the reset`, 'status-line warning'] : `Headed for about ${percent(headed)} at the reset`);
  if (limit.elsewhere_percent) subs.push(`~${Math.round(limit.elsewhere_percent)}% used elsewhere (estimate)`);
  if (limit.resets_at) subs.push('Resets ' + localTime(Date.parse(limit.resets_at)));
  if (limit.pace) subs.push([`Mark shows even pace (${percent(limit.pace.expected_percent)}) · from ${limitAge(limits)}`, 'faint']);
  return tile(limitName(limit), percent(limit.percent), subs, {meter: limit.percent / 100, expected: limit.pace ? limit.pace.expected_percent / 100 : undefined, elsewhere: limit.elsewhere_percent ? limit.elsewhere_percent / 100 : undefined});
}

function todayTile(account, shareable) {
  const pace = account.pace;
  const subs = [];
  if (pace.usual_usd !== null && pace.usual_usd > 0) {
    const times = account.cost_usd / pace.usual_usd;
    subs.push(times >= 1.5 ? [`${times.toFixed(1)}× your usual ${dollars(pace.usual_usd)} by ${pace.clock}`, 'status-line warning'] : `Usual by ${pace.clock}: ${dollars(pace.usual_usd)}`);
  } else {
    subs.push(['No usual yet', 'faint']);
  }
  if (account.fastest_session && !shareable) subs.push(['Busiest now: ' + account.fastest_session.label, 'faint']);
  return tile('Today', dollars(account.cost_usd), subs);
}

function driverTile(view, shareable) {
  const merged = new Map();
  for (const row of view.agents) {
    const id = row.agent + ' · ' + row.model;
    merged.set(id, {agent: row.agent, model: row.model, cost: (merged.get(id)?.cost || 0) + row.cost_usd});
  }
  const total = [...merged.values()].reduce((sum, row) => sum + row.cost, 0);
  const top = [...merged.values()].sort((a, b) => b.cost - a.cost)[0];
  if (!top || total <= 0) return null;
  const who = top.agent === 'you (no subagent)' ? 'Your own conversation' : top.agent;
  return tile('Biggest driver', percent(top.cost / total * 100), [
    `${who} on ${prettyModel(top.model)}`,
    [`${money(top.cost)} of ${money(total)}`, 'faint'],
  ], shareable ? {} : {onClick: () => document.getElementById('who')?.scrollIntoView({behavior: 'smooth', block: 'start'})});
}

// Chart

function spendChart(view, chartBy, entries, interactive) {
  const card = element('section', undefined, 'card');
  const head = element('div', undefined, 'card-head');
  head.append(element('h2', 'Spend per day'));
  if (interactive && !state.scope.length) head.append(tabs(CHART_BY, chartBy, chart => { state.chart = chart; load(); }, 'Color by', 'tabs small'));
  else head.append(element('span', 'By ' + GROUP_NAMES[chartBy].toLowerCase(), 'hint'));
  card.append(head);
  const {order, colors, totals, labels} = seriesColors(entries);
  const days = daysBetween(view.first, view.last);
  const index = new Map(days.map((day, position) => [day, position]));
  const perDay = days.map(() => new Map());
  for (const entry of entries) {
    const position = index.get(entry.day);
    if (position === undefined) continue;
    const id = order.includes(seriesId(entry)) ? seriesId(entry) : 'other';
    perDay[position].set(id, (perDay[position].get(id) || 0) + entry.cost_usd);
  }
  const dayTotals = perDay.map(values => [...values.values()].reduce((sum, value) => sum + value, 0));
  const step = niceStep(Math.max(...dayTotals, 1));
  const top = step * Math.ceil(Math.max(...dayTotals, step) / step);
  const width = interactive ? chartWidth() : 1000, height = 250, left = 48, right = 0, upper = 8, lower = 26;
  const slot = (width - left - right) / days.length;
  const dayEvery = days.length > 62 ? null : [1, 7, 14].find(every => slot * every >= DAY_LABEL_GAP) ?? 14;
  const monthEvery = Math.ceil(MONTH_LABEL_GAP / (slot * 30.4));
  const barWidth = Math.min(24, Math.max(slot * 0.72, 1));
  const y = value => upper + (height - upper - lower) * (1 - value / top);
  const root = svg('svg', {viewBox: `0 0 ${width} ${height}`, role: 'img', 'aria-label': `Spend per day, ${view.period}`});
  for (let value = 0; value <= top + step / 2; value += step) {
    root.append(svg('line', {x1: left, x2: width - right, y1: y(value), y2: y(value), stroke: value === 0 ? 'var(--axis)' : 'var(--grid)', 'stroke-width': 1}));
    const label = svg('text', {x: left - 10, y: y(value) + 4, 'text-anchor': 'end'});
    label.textContent = '$' + value.toLocaleString(undefined, {maximumFractionDigits: step < 1 ? 2 : 0});
    root.append(label);
  }
  days.forEach((day, position) => {
    const x = left + position * slot + (slot - barWidth) / 2;
    let base = 0;
    const stack = order.filter(id => perDay[position].get(id));
    stack.forEach((id, layer) => {
      const value = perDay[position].get(id);
      const yTop = y(base + value);
      const gap = layer > 0 && barWidth > 3 ? 2 : 0;
      const heightPx = Math.max(0, y(base) - yTop - gap);
      const radius = layer === stack.length - 1 && barWidth > 6 ? 3 : 0;
      root.append(radius ? svg('path', {d: roundedTop(x, yTop, barWidth, heightPx, radius), fill: colors.get(id)})
        : svg('rect', {x, y: yTop, width: barWidth, height: heightPx, fill: colors.get(id)}));
      base += value;
    });
    const labelled = dayEvery ? position % dayEvery === 0 : day.endsWith('-01') && (Number(day.slice(5, 7)) - 1) % monthEvery === 0;
    if (labelled) {
      const label = svg('text', {x: left + position * slot + slot / 2, y: height - 7, 'text-anchor': 'middle'});
      label.textContent = dayEvery ? shortDate(day) : new Date(day + 'T00:00:00Z').toLocaleDateString(undefined, {month: 'short', year: day.slice(5, 7) === '01' ? 'numeric' : undefined, timeZone: 'UTC'});
      root.append(label);
    }
    const parts = stack.slice().reverse().map(id => [labels.get(id) ?? 'Other', perDay[position].get(id), colors.get(id)]);
    const hit = svg('rect', {x: left + position * slot, width: slot, y: upper, height: height - upper - lower, fill: 'transparent'});
    if (!interactive) {
      const title = svg('title', {});
      title.textContent = `${shortDate(day)}: ${dollars(dayTotals[position])}` + parts.map(([label, value]) => `\n${label}: ${dollars(value)}`).join('');
      hit.append(title);
    } else {
      const show = event => showTip(event, day, dayTotals[position], parts);
      hit.addEventListener('pointermove', show);
      hit.addEventListener('pointerleave', hideTip);
      const open = () => { hideTip(); openDayPanel(day, dayTotals[position], parts); };
      hit.setAttribute('class', 'day');
      hit.addEventListener('click', open);
      if (days.length <= 62) {
        hit.setAttribute('tabindex', '0');
        hit.setAttribute('role', 'button');
        hit.setAttribute('aria-label', `${shortDate(day)}: ${dollars(dayTotals[position])}, open details`);
        hit.addEventListener('keydown', event => { if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); open(); } });
      }
    }
    root.append(hit);
  });
  const chart = element('div', undefined, 'chart');
  chart.append(root);
  const legend = element('div', undefined, 'legend');
  for (const id of order) {
    const item = element('span', labels.get(id) ?? 'Other', 'key');
    item.append(document.createTextNode(' '), element('b', money(totals.get(id) ?? 0)));
    item.style.setProperty('--swatch', colors.get(id));
    legend.append(item);
  }
  chart.append(legend);
  card.append(chart);
  if (!entries.length) card.append(element('p', 'No spend in this range.', 'note'));
  else if (interactive) card.append(element('p', 'Click a day for its details.', 'note'));
  return {card, colors};
}

function localMidnight(day) {
  return new Date(day + 'T00:00:00').getTime();
}

function limitsOverTime(view) {
  const card = element('section', undefined, 'card');
  const head = element('div', undefined, 'card-head');
  head.append(element('h2', 'Limits over time'), element('span', state.scope.length ? 'For the whole account, not only this focus · dashed lines mark resets' : 'Dashed lines mark resets', 'hint'));
  card.append(head);
  const start = localMidnight(view.first);
  const end = Math.min(localMidnight(addDays(view.last, 1)), Date.now());
  const accounts = forAccount(latest.limits.accounts);
  let drawn = 0;
  for (const account of accounts) {
    const charts = account.limits.map(limit => limitChart(limit, start, end)).filter(Boolean);
    if (charts.length && accounts.length > 1) {
      card.append(element('h3', latest.now.accounts.find(known => known.account === account.account)?.account_label ?? account.account, 'limits-account'));
    }
    card.append(...charts);
    drawn += charts.length;
  }
  if (!drawn) card.append(element('p', 'No limit readings in this range.', 'note'));
  return card;
}

function limitSteps(points, start, end) {
  const steps = [];
  const resets = [];
  points.forEach((point, position) => {
    const until = points[position + 1]?.at_ms ?? end;
    const reset = point.resets_at ? Date.parse(point.resets_at) : NaN;
    const resetsFirst = reset > point.at_ms && reset < until;
    steps.push({from: point.at_ms, to: resetsFirst ? reset : until, percent: point.percent, reset: Number.isNaN(reset) ? null : reset});
    if (resetsFirst) {
      resets.push(reset);
      steps.push({from: reset, to: until, percent: 0, reset: null, assumed: true});
    }
  });
  const clipped = steps
    .map(step => ({...step, from: Math.max(step.from, start), to: Math.min(step.to, end)}))
    .filter(step => step.to > step.from);
  return {steps: clipped, resets: resets.filter(reset => reset > start && reset < end)};
}

function limitChart(limit, start, end) {
  const {steps, resets} = limitSteps(limit.points, start, end);
  if (!steps.length) return null;
  const wrap = element('div', undefined, 'limit-chart');
  const peak = Math.max(...steps.map(step => step.percent));
  const top = element('div', undefined, 'limit-head');
  const name = element('b', limitName(limit));
  const peakText = element('span', `Peak ${percent(peak)}${resets.length ? ` · ${resets.length} ${resets.length === 1 ? 'reset' : 'resets'}` : ''}`);
  top.append(name, peakText);
  wrap.append(top);
  const width = chartWidth(), height = 120, left = 48, right = 0, upper = 6, lower = 24;
  const x = ms => left + (width - left - right) * (ms - start) / Math.max(end - start, 1);
  const y = value => upper + (height - upper - lower) * (1 - Math.min(value, 100) / 100);
  const root = svg('svg', {viewBox: `0 0 ${width} ${height}`, role: 'img', 'aria-label': `${limitName(limit)}, peak ${percent(peak)}`});
  for (const value of [0, 50, 100]) {
    root.append(svg('line', {x1: left, x2: width - right, y1: y(value), y2: y(value), stroke: value === 0 ? 'var(--axis)' : 'var(--grid)', 'stroke-width': 1}));
    const label = svg('text', {x: left - 10, y: y(value) + 4, 'text-anchor': 'end'});
    label.textContent = value + '%';
    root.append(label);
  }
  const days = dayCount(localDay(new Date(start)), localDay(new Date(end - 1)));
  const every = Math.max(1, Math.ceil(DAY_LABEL_GAP / ((width - left - right) / Math.max(days, 1))));
  for (let day = localDay(new Date(start)), position = 0; localMidnight(day) < end; day = addDays(day, 1), position++) {
    if (position % every) continue;
    const label = svg('text', {x: x(localMidnight(day)), y: height - 6, 'text-anchor': position === 0 ? 'start' : 'middle'});
    label.textContent = shortDate(day);
    root.append(label);
  }
  for (const reset of resets) {
    root.append(svg('line', {x1: x(reset), x2: x(reset), y1: upper, y2: height - lower, stroke: 'var(--muted)', 'stroke-width': 1, 'stroke-dasharray': '3 3'}));
  }
  let path = '';
  steps.forEach((step, position) => {
    const joined = position > 0 && steps[position - 1].to === step.from;
    path += `${joined ? 'V' : 'M' + x(step.from) + ','}${y(step.percent)} H${x(step.to)} `;
  });
  root.append(svg('path', {d: steps.map(step => `M${x(step.from)},${y(0)} V${y(step.percent)} H${x(step.to)} V${y(0)} Z`).join(' '), fill: 'var(--accent)', opacity: 0.14}));
  root.append(svg('path', {d: path, fill: 'none', stroke: 'var(--accent)', 'stroke-width': 2, 'stroke-linejoin': 'round'}));
  const hit = svg('rect', {x: left, y: upper, width: width - left - right, height: height - upper - lower, fill: 'transparent'});
  hit.addEventListener('pointermove', event => {
    const box = root.getBoundingClientRect();
    const at = start + (end - start) * ((event.clientX - box.left) * width / box.width - left) / (width - left - right);
    const step = steps.find(candidate => at >= candidate.from && at < candidate.to);
    if (step) showLimitTip(event, at, step);
    else hideTip();
  });
  hit.addEventListener('pointerleave', hideTip);
  root.append(hit);
  const chart = element('div', undefined, 'chart');
  chart.append(root);
  wrap.append(chart);
  return wrap;
}

function showLimitTip(event, at, step) {
  tip.replaceChildren();
  const head = element('div', undefined, 'head');
  head.append(element('span', localTime(at)), element('b', percent(step.percent)));
  tip.append(head);
  const note = step.assumed ? 'After the reset, before the next reading' : step.reset ? `Resets ${localTime(step.reset)}` : null;
  if (note) {
    const line = element('div', undefined, 'line');
    line.append(element('i'), element('span', note));
    tip.append(line);
  }
  tip.style.display = 'block';
  tip.style.left = Math.min(event.clientX + 16, window.innerWidth - tip.offsetWidth - 8) + 'px';
  tip.style.top = Math.min(event.clientY + 16, window.innerHeight - tip.offsetHeight - 8) + 'px';
}

function chartWidth() {
  const content = document.getElementById('content');
  const pad = parseFloat(getComputedStyle(content).getPropertyValue('--pad')) || 24;
  return Math.max(MIN_CHART_WIDTH, Math.round(content.clientWidth - 2 * pad - 2));
}

function roundedTop(x, y, width, height, radius) {
  const r = Math.min(radius, height, width / 2);
  return `M${x},${y + height} V${y + r} Q${x},${y} ${x + r},${y} H${x + width - r} Q${x + width},${y} ${x + width},${y + r} V${y + height} Z`;
}

function showTip(event, day, total, parts) {
  tip.replaceChildren();
  const head = element('div', undefined, 'head');
  head.append(element('span', new Date(day + 'T00:00:00Z').toLocaleDateString(undefined, {weekday: 'short', month: 'short', day: 'numeric', timeZone: 'UTC'})), element('b', dollars(total)));
  tip.append(head);
  for (const [label, value, color] of parts) {
    const line = element('div', undefined, 'line');
    const key = element('i');
    key.style.setProperty('--swatch', color);
    line.append(key, element('span', label), element('b', dollars(value)));
    tip.append(line);
  }
  tip.style.display = 'block';
  tip.style.left = Math.min(event.clientX + 16, window.innerWidth - tip.offsetWidth - 8) + 'px';
  tip.style.top = Math.min(event.clientY + 16, window.innerHeight - tip.offsetHeight - 8) + 'px';
}

function hideTip() {
  tip.style.display = 'none';
}

// Tables

function shareCell(fraction, color) {
  const cell = element('td');
  const wrap = element('div', undefined, 'share');
  const track = element('span', undefined, 'track');
  const fill = element('span');
  fill.style.width = fraction * 100 + '%';
  if (color) fill.style.setProperty('--swatch', color);
  if (fraction > 0) track.append(fill);
  wrap.append(track, element('em', shareText(fraction)));
  cell.append(wrap);
  return cell;
}

function mixCell(mix) {
  const cell = element('td');
  if (!mix) return cell;
  const total = MIX_PARTS.reduce((sum, [field]) => sum + mix[field], 0);
  if (total <= 0) return cell;
  const bar = element('div', undefined, 'mix');
  const words = [];
  for (const [field, label, slot] of MIX_PARTS) {
    if (mix[field] <= 0) continue;
    const part = element('span');
    part.style.flexGrow = String(mix[field]);
    part.style.background = `var(${slot})`;
    bar.append(part);
    words.push(`${label} ${shareText(mix[field] / total)}`);
  }
  bar.title = words.join(' · ') + ' (at list price)';
  bar.setAttribute('aria-label', bar.title);
  cell.append(bar);
  return cell;
}

function mixLegend() {
  const legend = element('div', undefined, 'mix-legend');
  legend.append(element('span', 'Paid for:', 'dim'));
  for (const [, label, slot] of MIX_PARTS) {
    const key = element('span', label, 'key');
    key.style.setProperty('--swatch', `var(${slot})`);
    legend.append(key);
  }
  return legend;
}

function columns(table, first) {
  const group = element('colgroup');
  for (const width of ['36%', '19%', '11%', '9%', '11%', '14%']) {
    const column = element('col');
    column.style.width = width;
    group.append(column);
  }
  table.append(group);
  const header = table.createTHead().insertRow();
  for (const name of [first, 'Share', 'Cost', 'Sessions', 'Per session', 'Paid for']) header.append(element('th', name));
}

function nameCell(text, depth, open, canOpen, meta, tree = true) {
  const cell = element('td', undefined, 'name');
  const wrap = element('div', undefined, 'name-wrap');
  wrap.style.paddingLeft = depth * 20 + 'px';
  if (tree) wrap.append(chevron(open, canOpen));
  const textBox = element('span', undefined, 'name-text');
  textBox.append(document.createTextNode(text));
  if (meta) textBox.append(element('span', meta, 'name-meta'));
  textBox.title = meta ? `${text}\n${meta}` : text;
  wrap.append(textBox);
  cell.append(wrap);
  return cell;
}

function sessionMeta(session) {
  const parts = [];
  if (session.first_ms) parts.push(longDate(session.first_ms));
  const skill = session.skills[0];
  if (skill) parts.push(`${skillName(skill.label)} ${shareText(skill.share)}`);
  if (session.active_minutes) parts.push(minutes(session.active_minutes) + ' active');
  if (session.peak_context) parts.push(`peak ${compact(session.peak_context)} context`);
  return parts.join(' · ');
}

function ago(ms) {
  const elapsed = Math.round((Date.now() - ms) / 60000);
  return elapsed < 1 ? 'just now' : elapsed < 60 ? `${elapsed} min ago` : `${Math.round(elapsed / 60)} h ago`;
}

function adviceCard(view) {
  if (state.scope.length || view.last < view.today) return null;
  const entries = forAccount(latest.advice.accounts);
  const card = element('section', undefined, 'card');
  const head = element('div', undefined, 'card-head');
  const span = entries.length && entries.every(entry => entry.behaviors?.week) ? 'This week\'s usage' : entries.length && entries.every(entry => !entry.behaviors?.week && entry.behaviors?.day) ? 'Today\'s usage' : 'Usage';
  head.append(element('h2', 'Anthropic\'s advice'), element('span', entries.length ? `${span}, from Claude Code's /usage, read ${ago(Math.max(...entries.map(entry => entry.fetched_at_ms)))}` : 'From Claude Code\'s /usage', 'hint'));
  card.append(head);
  if (!entries.length) {
    card.append(element('p', 'No advice saved today. The engine saves it hourly while Claude Code is active.', 'note'));
    return card;
  }
  for (const entry of entries) {
    const period = entry.behaviors?.week ? ['this week', entry.behaviors.week] : entry.behaviors?.day ? ['today', entry.behaviors.day] : null;
    if (state.account === ALL) card.append(element('h3', latest.now.accounts.find(account => account.account === entry.account)?.account_label ?? entry.account));
    const recommendations = period?.[1].recommendations ?? [];
    if (!recommendations.length) {
      card.append(element('p', 'Nothing flagged.', 'note'));
      continue;
    }
    const list = element('div', undefined, 'advice');
    for (const recommendation of recommendations) {
      const row = element('div', undefined, 'advice-row');
      const what = element('div');
      what.append(element('span', recommendation.title ?? String(recommendation.key ?? '').replace(/_/g, ' ')));
      if (recommendation.detail) what.append(element('small', recommendation.detail));
      row.append(what, element('b', `${percent(recommendation.pct ?? 0)} of usage`));
      list.append(row);
    }
    card.append(list);
    card.append(element('p', `Each percentage is the share of your usage ${period[0]} that matched the pattern, so they overlap.`, 'note'));
  }
  return card;
}

function clickable(line, action) {
  line.classList.add('clickable');
  line.tabIndex = 0;
  line.addEventListener('click', action);
  line.addEventListener('keydown', event => { if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); action(); } });
}

function breakdown(view, colors) {
  const by = breakdownGrouping();
  const card = element('section', undefined, 'card');
  const head = element('div', undefined, 'card-head');
  head.append(element('h2', 'Where it went'), tabs(groupings().map(kind => [kind, GROUP_NAMES[kind]]), by, picked => { state.by = picked; showTail = false; load(); }, 'Break down by', 'tabs small'));
  card.append(head);
  if (!view.rows.length) {
    card.append(element('p', 'No spend in this range.', 'note'));
    return card;
  }
  card.append(mixLegend());
  const total = cost(view.rows);
  const sameColors = by === chartGrouping();
  const opensPanel = Boolean(SCOPE_OF_LEVEL[view.level]);
  const wrapper = element('div', undefined, 'table');
  const table = element('table');
  columns(table, LEVEL_NAMES[view.level]);
  const body = table.createTBody();
  const foot = table.createTFoot().insertRow();
  const sessions = [...view.mix.values()].reduce((sum, mix) => sum + mix.sessions, 0);
  foot.append(element('td', 'Total'), element('td', ''), element('td', dollars(total)), element('td', ''), element('td', ''), element('td', ''));

  const valueCells = (line, row, mix) => {
    line.append(shareCell(total > 0 ? (row.cost_usd ?? 0) / total : 0, row.color));
    line.append(element('td', row.cost_usd == null ? 'no price' : dollars(row.cost_usd)));
    const count = mix?.sessions ?? 0;
    line.append(element('td', count ? count.toLocaleString() : '', count ? '' : 'dim'));
    line.append(element('td', perSession(row, mix)));
    line.append(mixCell(mix));
  };

  const addRow = (row, color, depth) => {
    const line = body.insertRow();
    if (depth) line.classList.add('child');
    line.append(nameCell(rowName(row, view.level), depth, false, false, null, false));
    valueCells(line, {...row, color}, view.mix.get(rowId(row)));
    if (row.not_in_transcript) clickable(line, openNotInTranscriptsPanel);
    else if (opensPanel && row.key != null) clickable(line, () => openRowPanel(row, view.level));
  };

  const fill = () => {
    body.replaceChildren();
    const major = view.rows.length > 8 ? view.rows.filter(row => (row.cost_usd ?? 0) >= total * FOLD_SHARE) : view.rows;
    const tail = view.rows.filter(row => !major.includes(row));
    const shown = tail.length >= 2 ? major : view.rows;
    for (const row of shown) addRow(row, sameColors ? colors.get(rowId(row)) ?? 'var(--other)' : null, 0);
    if (tail.length < 2) return;
    const line = body.insertRow();
    line.setAttribute('aria-expanded', String(showTail));
    line.append(nameCell(`Other ${GROUP_PLURALS[by]} (${tail.length}), each under 1%`, 0, showTail, true));
    valueCells(line, {cost_usd: cost(tail), color: 'var(--other)'}, foldMix(tail, view.mix));
    clickable(line, () => { showTail = !showTail; fill(); });
    if (showTail) for (const row of tail) addRow(row, 'var(--other)', 1);
  };

  fill();
  wrapper.append(table);
  card.append(wrapper);
  const distinct = view.sessionCount ?? sessions;
  const partial = view.keptFrom && view.keptFrom > view.first;
  const hint = distinct ? `${distinct.toLocaleString()} sessions in this range${partial ? `, counted from ${shortDate(view.keptFrom)}, when session detail starts` : ''}. ` : '';
  card.append(element('p', `${hint}"Paid for" splits each row's cost by token type at list price; hover a bar for the shares. Click a row for its details, and focus the page on it from there.`, 'note'));
  return card;
}

function changeText(now, before) {
  if (before > 0) return multiple(now / before);
  return now > 0 ? 'new' : '';
}

function staticBreakdown(title, rows, level, mix, previous) {
  const card = element('section', undefined, 'card');
  const head = element('div', undefined, 'card-head');
  head.append(element('h2', title));
  if (previous) head.append(element('span', `Change compares with ${previous.label}${previous.label.startsWith('the ') ? ` (${previous.dates})` : ''}`, 'hint'));
  card.append(head, mixLegend());
  const total = cost(rows);
  const wrapper = element('div', undefined, 'table');
  const table = element('table');
  const widths = previous ? ['30%', '16%', '11%', '9%', '9%', '10%', '15%'] : ['36%', '19%', '11%', '9%', '11%', '14%'];
  const group = element('colgroup');
  for (const width of widths) {
    const column = element('col');
    column.style.width = width;
    group.append(column);
  }
  table.append(group);
  const header = table.createTHead().insertRow();
  for (const name of [LEVEL_NAMES[level], 'Share', 'Cost', ...(previous ? ['Change'] : []), 'Sessions', 'Per session', 'Paid for']) header.append(element('th', name));
  const body = table.createTBody();
  const major = rows.length > 8 ? rows.filter(row => (row.cost_usd ?? 0) >= total * FOLD_SHARE) : rows;
  const tail = rows.filter(row => !major.includes(row));
  const shownRows = tail.length >= 2 ? [...major] : rows;
  if (tail.length >= 2) {
    const tailMix = foldMix(tail, mix);
    shownRows.push({label: `Other (${tail.length}), each under 1%`, key: 'folded tail', cost_usd: cost(tail), folded: true, before: tail.reduce((sum, row) => sum + (previous?.costs.get(rowId(row)) ?? 0), 0)});
    mix.set('folded tail', tailMix);
  }
  for (const row of shownRows) {
    const line = body.insertRow();
    line.append(nameCell(row.folded ? row.label : rowName(row, level), 0, false, false, null, false));
    const rowMix = mix.get(rowId(row));
    line.append(shareCell(total > 0 ? (row.cost_usd ?? 0) / total : 0));
    line.append(element('td', row.cost_usd == null ? 'no price' : dollars(row.cost_usd)));
    if (previous) line.append(element('td', changeText(row.cost_usd ?? 0, row.folded ? row.before : previous.costs.get(rowId(row)) ?? 0)));
    const count = rowMix?.sessions ?? 0;
    line.append(element('td', count ? count.toLocaleString() : ''), element('td', perSession(row, rowMix)), mixCell(rowMix));
  }
  const foot = table.createTFoot().insertRow();
  foot.append(element('td', 'Total'), element('td', ''), element('td', dollars(total)));
  if (previous) foot.append(element('td', changeText(total, [...previous.costs.values()].reduce((sum, value) => sum + value, 0))));
  foot.append(element('td', ''), element('td', ''), element('td', ''));
  wrapper.append(table);
  card.append(wrapper);
  return card;
}

function whoDidTheWork(rows, interactive) {
  const card = element('section', undefined, 'card');
  card.id = 'who';
  const head = element('div', undefined, 'card-head');
  head.append(element('h2', 'Who did the work'), element('span', 'Your own conversation and each subagent, by the model it ran on', 'hint'));
  card.append(head);
  if (!rows.length) {
    card.append(element('p', 'No spend in this range.', 'note'));
    return card;
  }
  const modelTotals = new Map();
  const agents = new Map();
  for (const row of rows) {
    modelTotals.set(row.model, (modelTotals.get(row.model) || 0) + row.cost_usd);
    const id = (row.not_in_transcript ? 'u:' : '') + (row.agent_key ?? row.agent);
    if (!agents.has(id)) agents.set(id, {label: row.not_in_transcript && !row.agent_key ? NOT_IN_TRANSCRIPTS : agentName(row.agent), key: row.agent_key ?? null, raw: row.agent, models: new Map(), total: 0});
    const agent = agents.get(id);
    agent.models.set(row.model, (agent.models.get(row.model) || 0) + row.cost_usd);
    agent.total += row.cost_usd;
  }
  const models = [...modelTotals.keys()].sort((a, b) => modelTotals.get(b) - modelTotals.get(a));
  const shown = models.slice(0, 3);
  const rest = models.slice(3);
  const total = [...agents.values()].reduce((sum, agent) => sum + agent.total, 0);
  const wrapper = element('div', undefined, 'table');
  const table = element('table');
  const group = element('colgroup');
  const modelColumns = shown.length + (rest.length ? 1 : 0);
  for (const width of ['30%', '22%', ...Array(modelColumns).fill(`${36 / modelColumns}%`), '12%']) {
    const column = element('col');
    column.style.width = width;
    group.append(column);
  }
  table.append(group);
  const header = table.createTHead().insertRow();
  header.append(element('th', 'Who'), element('th', 'Share'));
  for (const model of shown) header.append(element('th', prettyModel(model)));
  if (rest.length) header.append(element('th', 'Other models'));
  header.append(element('th', 'Total'));
  const body = table.createTBody();
  for (const agent of [...agents.values()].sort((a, b) => b.total - a.total)) {
    const line = body.insertRow();
    line.append(nameCell(agent.label, 0, false, false, null, false), shareCell(total > 0 ? agent.total / total : 0));
    if (interactive && agent.key === null) clickable(line, openNotInTranscriptsPanel);
    else if (interactive && !scopedKinds().has('agent')) clickable(line, () => openRowPanel({key: agent.key, label: agent.raw}, 'agent'));
    const cell = value => element('td', value >= 0.005 ? dollars(value) : '—', value >= 0.005 ? '' : 'dim');
    for (const model of shown) line.append(cell(agent.models.get(model) || 0));
    if (rest.length) line.append(cell(rest.reduce((sum, model) => sum + (agent.models.get(model) || 0), 0)));
    line.append(element('td', dollars(agent.total)));
  }
  const foot = table.createTFoot().insertRow();
  foot.append(element('td', 'Total'), element('td', ''));
  for (const model of shown) foot.append(element('td', dollars(modelTotals.get(model))));
  if (rest.length) foot.append(element('td', dollars(rest.reduce((sum, model) => sum + modelTotals.get(model), 0))));
  foot.append(element('td', dollars(total)));
  wrapper.append(table);
  card.append(wrapper);
  return card;
}

const INSIGHT_ROWS = 8;
let insightsShowAll = false;
let insightsTab = 'suggestions';

function perRun(weeks) {
  const runs = weeks.reduce((sum, week) => sum + week.runs, 0);
  const cost = weeks.reduce((sum, week) => sum + week.cost_usd, 0);
  return runs ? cost / runs : null;
}

function signedPercent(fraction) {
  return `${fraction < 0 ? '−' : '+'}${percent(Math.abs(fraction) * 100)}`;
}

function weekText(week) {
  return week.cost_per_run_usd === null ? `${shortDate(week.week)}: no runs` : `${shortDate(week.week)}: ${dollars(week.cost_per_run_usd)} a run, ${week.runs} run${week.runs === 1 ? '' : 's'}`;
}

function changeEffect(change) {
  if (change.effect === 'reversed') return `reversed ${shortDate(change.reversed_on)}`;
  return `${change.effect} ${dollars(change.monthly_usd, 0)} a month`;
}

function lowerFirst(text) {
  return text.charAt(0).toLowerCase() + text.slice(1);
}

function insightLine(row, note) {
  const line = element('div', undefined, 'insight-row');
  const sized = note.takeaways.filter(item => item.monthly_usd !== null);
  const headline = sized[0] ?? note.takeaways[0];
  const main = element('div', undefined, 'insight-main');
  const title = element('span', headline?.title ?? '', sized.length ? '' : 'dim');
  main.append(title);
  if (sized.length > 1) main.append(element('span', ` +${sized.length - 1} more`, 'dim'));
  const recent = perRun(row.weeks.slice(-2));
  const before = perRun(row.weeks.slice(-4, -2));
  const last = element('span', recent === null ? '—' : dollars(recent), 'insight-num insight-last' + (recent === null ? ' dim' : ''));
  if (recent !== null && before) last.append(element('small', signedPercent(recent / before - 1)));
  const name = element('span', row.name, 'insight-name');
  if (note.subagent) name.append(element('small', 'Subagent'));
  line.append(name, main, element('span', row.runs.toLocaleString(), 'insight-num insight-runs'), element('b', note.to_save_usd === null ? '—' : dollars(note.to_save_usd, 0), 'insight-num' + (note.to_save_usd === null ? ' dim' : '')), last);
  clickable(line, () => insightsPanel(row, note.subagent, note));
  return line;
}

function claudePrompt(row, isSubagent) {
  return `Use Gigawatts to explain why my "${row.name}" ${isSubagent ? 'subagent' : 'skill'} costs what it does, and propose edits to its file that would make it cheaper.`;
}

function showWeekTip(event, week) {
  tip.replaceChildren();
  const head = element('div', undefined, 'head');
  head.append(element('span', `Week of ${shortDate(week.week)}`), element('b', week.cost_per_run_usd === null ? 'no runs' : `${dollars(week.cost_per_run_usd)} a run`));
  tip.append(head, element('div', `${week.runs} run${week.runs === 1 ? '' : 's'}, ${dollars(week.cost_usd)} in all`));
  tip.style.display = 'block';
  const rect = event.currentTarget.getBoundingClientRect();
  tip.style.left = Math.max(8, Math.min(rect.left, window.innerWidth - tip.offsetWidth - 8)) + 'px';
  tip.style.top = Math.min(rect.bottom + 8, window.innerHeight - tip.offsetHeight - 8) + 'px';
}

function weeklyBars(row, markWeeks, splitWeek) {
  const max = Math.max(0, ...row.weeks.map(week => week.cost_per_run_usd ?? 0));
  const chart = element('div', undefined, 'week-chart');
  chart.setAttribute('role', 'img');
  chart.setAttribute('aria-label', `Cost per run by week. ${row.weeks.map(weekText).join('. ')}`);
  const top = element('div', undefined, 'week-top');
  top.append(element('span', dollars(max)), element('span', 'a run'));
  const cols = element('div', undefined, 'week-cols');
  cols.style.setProperty('--weeks', row.weeks.length);
  const changed = new Set(markWeeks);
  for (const week of row.weeks) {
    const col = element('div', undefined, 'week-col');
    col.tabIndex = 0;
    const plot = element('div', undefined, 'week-plot');
    const height = max && week.cost_per_run_usd ? week.cost_per_run_usd / max * 100 : 0;
    if (height) {
      const bar = element('span', undefined, splitWeek && week.week < splitWeek ? 'week-bar before' : 'week-bar');
      bar.style.height = Math.max(height, 2) + '%';
      plot.append(bar);
    }
    if (changed.has(week.week)) {
      const dot = element('span', undefined, 'week-shift');
      dot.style.bottom = height + '%';
      plot.append(dot);
    }
    col.append(plot, element('span', shortDate(week.week)), element('span', week.runs.toLocaleString()));
    col.addEventListener('mouseenter', event => showWeekTip(event, week));
    col.addEventListener('focus', event => showWeekTip(event, week));
    col.addEventListener('mouseleave', hideTip);
    col.addEventListener('blur', hideTip);
    cols.append(col);
  }
  chart.append(top, cols, element('p', 'Under each date, that week\'s runs. Hover a week for its numbers.', 'week-note'));
  return chart;
}

function changeBlock(change) {
  const block = element('div', undefined, 'change-block');
  const head = element('div', undefined, 'takeaway-head');
  head.append(element('b', `${shortDate(change.week)} · ${change.cause}`), element('span', changeEffect(change), 'dim'));
  const moved = change.shared_with.length ? ` The same change moved ${change.shared_with.join(', ')}.` : '';
  block.append(head, element('p', `${dollars(change.before_cost_per_run_usd)} → ${dollars(change.after_cost_per_run_usd)} a run, averaging the two weeks on each side.${moved}`));
  return block;
}

function insightsPanel(row, isSubagent, note) {
  panelShell(row.name, `${isSubagent ? 'Subagent' : 'Skill'} · last 8 weeks, every account`);
  const {facts, fact} = factList();
  fact('Cost', `${dollars(row.cost_usd)} over ${row.runs.toLocaleString()} run${row.runs === 1 ? '' : 's'}`);
  if (row.cost_per_run_usd !== null) fact('Per run', dollars(row.cost_per_run_usd));
  if (!isSubagent && row.cost_usd > 0) fact('Subagents', `${shareText(row.subagent_cost_usd / row.cost_usd)} of its cost`);
  if (row.facts?.runs_per_session) fact('Runs a session', row.facts.runs_per_session.toFixed(1));
  if (row.facts && row.cost_usd > 0) fact('Repeat runs', `${dollars(row.facts.repeat_run_cost_usd)}, ${shareText(row.facts.repeat_run_cost_usd / row.cost_usd)} of its cost`);
  if (row.facts?.top_tenth_session_share != null) fact('Costliest tenth', `${shareText(row.facts.top_tenth_session_share)} of its cost`);
  if (isSubagent && row.first_request_cost_usd !== null) fact('First requests', dollars(row.first_request_cost_usd));
  panel.append(facts);
  panel.append(element('h3', 'Cost per run, week by week'));
  panel.append(weeklyBars(row, note.changes.map(change => change.week)));
  panel.append(element('h3', 'Takeaways'));
  const list = element('div', undefined, 'takeaways');
  for (const item of note.takeaways) {
    const entry = element('div', undefined, 'takeaway');
    const head = element('div', undefined, 'takeaway-head');
    head.append(element('b', item.title));
    if (item.monthly_usd !== null) head.append(element('span', `about ${dollars(item.monthly_usd, 0)} a month`, 'dim'));
    entry.append(head, element('p', item.detail));
    list.append(entry);
  }
  panel.append(list);
  if (note.changes.length) {
    panel.append(element('h3', 'Changes'));
    const changes = element('div', undefined, 'takeaways');
    for (const change of note.changes) changes.append(changeBlock(change));
    panel.append(changes);
  }
  if (row.facts?.launches.length) {
    panel.append(element('h3', 'Subagents it launches'));
    const {facts: launches, fact: launch} = factList();
    for (const entry of row.facts.launches) {
      launch(entry.agent, `${entry.per_run === null ? entry.launches : entry.per_run.toFixed(1) + ' a run'} · ${dollars(entry.cost_usd)}, first requests ${dollars(entry.first_request_cost_usd)}`);
    }
    panel.append(launches);
  }
  panel.append(element('h3', 'Ask Claude for edits'));
  const prompt = claudePrompt(row, isSubagent);
  panel.append(element('p', 'Gigawatts finds where the money goes; Claude reads your skill and agent files and proposes the edits. Paste this into Claude Code:', 'panel-text'));
  panel.append(element('p', prompt, 'prompt'));
  panelAction('Copy prompt', async event => {
    const button = event.currentTarget;
    try {
      await navigator.clipboard.writeText(prompt);
      button.textContent = 'Copied';
    } catch {
      button.textContent = 'Select the text above to copy it';
    }
  });
}

function insightRows() {
  const {skills, agents, takeaways} = latest.insights;
  return [...(takeaways?.skills ?? []), ...(takeaways?.agents ?? [])]
    .map(note => [(note.subagent ? agents : skills).find(row => row.name === note.name), note])
    .filter(([row]) => row)
    .sort(([a, x], [b, y]) => (y.to_save_usd ?? -1) - (x.to_save_usd ?? -1) || b.cost_usd - a.cost_usd);
}

function eventEffect(event) {
  return event.effect === 'reversed' ? `reversed ${shortDate(event.reversed_on)}` : `${event.effect} ${dollars(event.monthly_usd, 0)} a month`;
}

function eventNextStep(event) {
  const names = event.rows.map(member => member.name).join(', ');
  if (event.effect === 'saving') return `Keep it. It saves about ${dollars(event.monthly_usd, 0)} a month against the weeks before it.`;
  if (event.effect === 'reversed') return `Set back ${shortDate(event.reversed_on)}, so there's nothing to do.`;
  if (event.cause === 'No model or effort change') return `Nothing in the model or effort explains it. Check edits to ${names} around ${shortDate(event.week)}.`;
  return `If this change wasn't on purpose, setting it back would save about ${dollars(event.monthly_usd, 0)} a month.`;
}

function memberChange(entry, week) {
  return entry?.[1].changes.find(change => change.week === week);
}

function eventPanel(event, ordered) {
  panelShell(event.cause, `${shortDate(event.week)} · last 8 weeks, every account`);
  const entries = event.rows.map(member => [member, ordered.find(([row, note]) => row.name === member.name && note.subagent === member.subagent)]);
  const {facts, fact} = factList();
  fact('Effect', eventEffect(event));
  fact('Moved', event.rows.map(member => member.name).join(', '));
  if (event.undid) fact('Undid', `${shortDate(event.undid.week)}: ${lowerFirst(event.undid.cause)}`);
  panel.append(facts);
  panel.append(element('p', eventNextStep(event), 'panel-text next-step'));
  panel.append(element('h3', 'Cost per run, week by week'));
  const marks = [event.week, event.undid?.week].filter(Boolean);
  const charts = element('div', undefined, 'takeaways');
  for (const [member, entry] of entries) {
    if (!entry) continue;
    const change = memberChange(entry, event.week);
    const block = element('div', undefined, 'event-chart');
    const head = element('div', undefined, 'takeaway-head');
    head.append(element('b', member.name), element('span', change ? `${dollars(change.before_cost_per_run_usd)} → ${dollars(change.after_cost_per_run_usd)} a run` : '', 'dim'));
    block.append(head, weeklyBars(entry[0], marks, event.week));
    charts.append(block);
  }
  charts.append(element('p', `Faded bars are the weeks before ${shortDate(event.week)}. ${event.undid ? `Dots mark ${shortDate(event.week)} and the ${shortDate(event.undid.week)} change it undid.` : `A dot marks ${shortDate(event.week)}.`} The figures beside each name average the two weeks on each side.`, 'note'));
  panel.append(charts);
  panel.append(element('h3', 'Open a row'));
  const links = element('div', undefined, 'insight-links');
  for (const [member, entry] of entries) {
    if (!entry) continue;
    const line = element('div', undefined, 'insight-link');
    line.append(element('span', member.name), element('span', member.subagent ? 'Subagent' : 'Skill', 'dim'));
    clickable(line, () => insightsPanel(entry[0], member.subagent, entry[1]));
    links.append(line);
  }
  panel.append(links);
}

function changesTab(card, events, ordered) {
  const total = effect => events.filter(event => event.effect === effect).reduce((sum, event) => sum + event.monthly_usd, 0);
  const verdict = [['saving', total('saving')], ['costing', total('costing')]].filter(([, value]) => value).map(([word, value]) => `${word} ${dollars(value, 0)} a month`).join(', ');
  if (!events.length) {
    card.append(element('p', 'No change in cost per run of 30% or more in the last 8 weeks.', 'note'));
    return;
  }
  if (verdict) card.append(element('p', verdict.charAt(0).toUpperCase() + verdict.slice(1), 'insight-verdict'));
  const list = element('div');
  for (const event of events) {
    const line = element('div', undefined, `change-event ${event.effect}`);
    const what = element('div');
    what.append(element('span', event.cause));
    const rows = event.rows.map(member => member.name).join(', ');
    what.append(element('small', event.undid ? `${rows}, undoing ${shortDate(event.undid.week)}: ${lowerFirst(event.undid.cause)}` : rows));
    line.append(element('span', shortDate(event.week)), what, element('b', eventEffect(event)));
    clickable(line, () => eventPanel(event, ordered));
    list.append(line);
  }
  card.append(list);
  card.append(element('p', 'Each change in cost per run of 30% or more, listed once with every skill and subagent it moved, and sized by the one it moved most. Savings and costs are against the two weeks before each change. A rise that a later change set back is folded into that later line. Click a change to see it week by week.', 'note'));
}

function suggestionsTab(card, ordered) {
  const list = element('div', undefined, 'insight-list');
  const header = element('div', undefined, 'insight-row insight-header');
  header.append(element('span', 'What ran'), element('span', 'Biggest takeaway'), element('span', 'Runs', 'insight-num insight-runs'), element('span', 'At stake a month', 'insight-num'), element('span', 'Last 2 weeks', 'insight-num insight-last'));
  list.append(header);
  const shown = insightsShowAll ? ordered : ordered.slice(0, INSIGHT_ROWS);
  for (const [row, note] of shown) list.append(insightLine(row, note));
  card.append(list);
  if (ordered.length > INSIGHT_ROWS) {
    const more = element('button', insightsShowAll ? 'Show fewer' : 'Show all', 'button');
    more.type = 'button';
    more.addEventListener('click', () => { insightsShowAll = !insightsShowAll; render(); });
    card.append(more);
  }
  card.append(element('p', 'Each row is one skill or subagent, the most at stake first. A skill\'s cost includes the subagents it launched, so a skill and one of its subagents can count the same dollars; don\'t add rows together. Click a row for its cost per run week by week, its takeaways and changes, and a prompt to ask Claude for edits. Costs are at list price.', 'note'));
}

function insightsCard() {
  if (state.scope.length) return null;
  if (!latest.insights) return insightsError ? insightsFailure() : null;
  const ordered = insightRows();
  const card = element('section', undefined, 'card');
  const head = element('div', undefined, 'card-head');
  head.append(element('h2', 'Insights'));
  if (ordered.length) head.append(tabs([['suggestions', 'Suggestions'], ['changes', 'Changes']], insightsTab, picked => { insightsTab = picked; render(); }, 'Show', 'tabs small'));
  card.append(head);
  card.append(element('p', `Last 8 weeks across every account, ${shortDate(latest.insights.data_starts)} to ${shortDate(latest.insights.until)}. The range and account picked above don't change it.`, 'note insight-scope'));
  if (!ordered.length) {
    card.append(element('p', 'No skill or subagent runs in the last 8 weeks.', 'note'));

    changesTab(card, latest.insights.takeaways?.events ?? [], ordered);

function biggestSessions(view) {
  const card = element('section', undefined, 'card');
  const head = element('div', undefined, 'card-head');
