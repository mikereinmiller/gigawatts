  return cell;
}

function sessionMeta(session) {
  const parts = [];
  if (session.first_ms) parts.push(longDate(session.first_ms));
  const skill = session.skills[0];
  if (skill) parts.push(`${skillName(skill.label)} ${shareText(skill.share)}`);
  if (session.active_minutes) parts.push(minutes(session.active_minutes) + ' active');
  if (session.peak_context) parts.push(`peak ${compact(session.peak_context)} context`);
  return parts.join(' · ');
}

function ago(ms) {
  const elapsed = Math.round((Date.now() - ms) / 60000);
  return elapsed < 1 ? 'just now' : elapsed < 60 ? `${elapsed} min ago` : `${Math.round(elapsed / 60)} h ago`;
}

function foldRows(rows) {
  if (rows.length < FOLD_KEEP + 2) return {major: rows, tail: []};
  return {major: rows.slice(0, FOLD_KEEP), tail: rows.slice(FOLD_KEEP)};
}

function foldSmallRows(rows, costOf) {
  if (rows.length <= EXPORT_FOLD_MIN_ROWS) return {major: rows, tail: []};
  const total = rows.reduce((sum, row) => sum + (costOf(row) ?? 0), 0);
  const major = rows.filter(row => (costOf(row) ?? 0) >= total * EXPORT_FOLD_SHARE);
  const tail = rows.filter(row => !major.includes(row));
  return tail.length >= 2 ? {major, tail} : {major: rows, tail: []};
}

function foldRow(body, label, linkText, onClick) {
  const line = body.insertRow();
  const cell = element('td', undefined, 'name');
  const wrap = element('div', undefined, 'name-wrap');
  if (label) wrap.append(element('span', label, 'name-text'));
  if (linkText) {
    const link = element('button', linkText, 'link-button inline');
    link.type = 'button';
    link.addEventListener('click', onClick);
    wrap.append(link);
  }
  cell.append(wrap);
  line.append(cell);
  return line;
}

function clickable(line, action) {
  line.classList.add('clickable');
  line.tabIndex = 0;
  line.addEventListener('click', action);
  line.addEventListener('keydown', event => { if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); action(); } });
}

function rankRow(name, value, total, top) {
  const line = element('div', undefined, 'rank');
  const label = element('span', undefined, 'rank-name');
  label.append(element('span', name, 'name-text'));
  label.title = name;
  const track = element('span', undefined, 'track');
  const fill = element('span');
  fill.style.width = (top > 0 ? (value ?? 0) / top * 100 : 0) + '%';
  if (value > 0) track.append(fill);
  line.append(label, track, element('b', value == null ? 'no price' : money(value)), element('em', shareText(total > 0 ? (value ?? 0) / total : 0)));
  return line;
}

function breakdown(view) {
  const by = breakdownGrouping();
  const card = element('section', undefined, 'card');
  const head = element('div', undefined, 'card-head');
  head.append(element('h2', 'Where it went'), tabs(groupings().map(kind => [kind, GROUP_NAMES[kind]]), by, picked => { state.by = picked; expanded.delete('where'); loadBreakdown(); }, 'Break down by', 'tabs small'));
  card.append(head);
  if (!view.rows.length) {
    card.append(element('p', 'No spend in this range.', 'note'));
    return card;
  }
  const total = cost(view.rows);
  const opensPanel = Boolean(SCOPE_OF_LEVEL[view.level]);
  const {major, tail} = foldRows(view.rows);
  const top = Math.max(0, cost(tail), ...view.rows.map(row => row.cost_usd ?? 0));
  const list = element('div', undefined, 'rank-list' + (['repo', 'repo_branch'].includes(view.level) ? ' code' : ''));
  const toggle = () => { expanded.has('where') ? expanded.delete('where') : expanded.add('where'); fill(); };
  const link = text => {
    const button = element('button', text, 'link-button inline');
    button.type = 'button';
    button.addEventListener('click', toggle);
    return button;
  };

  const fill = () => {
    list.replaceChildren();
    const open = expanded.has('where');
    for (const row of open ? view.rows : major) {
      const line = rankRow(rowName(row, view.level), row.cost_usd, total, top);
      if (row.not_in_transcript) clickable(line, openNotInTranscriptsPanel);
      else if (opensPanel && row.key != null) clickable(line, () => openRowPanel(row, view.level));
      list.append(line);
    }
    if (!tail.length) return;
    if (open) {
      list.append(link('Show fewer'));
      return;
    }
    const others = rankRow(`Others (${tail.length})`, cost(tail), total, top);
    others.classList.add('others');
    others.firstChild.append(link('Show'));
    list.append(others);
  };

  fill();
  card.append(list);
  if (opensPanel) card.append(element('p', view.level === 'repo' ? 'Click a row for its branches, sessions, and token mix.' : 'Click a row for its sessions and token mix.', 'note'));
  return card;
}

const PAID_FOR_LINES = {
  input_usd: 'New prompt text not yet cached.',
  output_usd: 'What Claude wrote, thinking included.',
  cache_write_usd: 'Context built from scratch: a new session, a subagent launch, or a resume after the cache expired. Fewer launches and cold restarts lower it.',
  cache_read_usd: 'Context re-read on every turn. Grows with long sessions.',
};

function paidForCard(view) {
  const card = element('section', undefined, 'card');
  const head = element('div', undefined, 'card-head');
  head.append(element('h2', 'What the money paid for'));
  card.append(head);
  const paid = paidTotals(forAccount(latest.data.rows));
  if (paid.total <= 0) {
    card.append(element('p', 'No priced tokens in this range.', 'note'));
    return card;
  }
  const before = previousPaid(view);
  const parts = MIX_PARTS.filter(([field]) => paid[field] > 0).sort(([a], [b]) => paid[b] - paid[a]);
  const bar = element('div', undefined, 'paid-bar');
  bar.setAttribute('role', 'img');
  bar.setAttribute('aria-label', parts.map(([field, label]) => `${label} ${shareText(paid[field] / paid.total)}`).join(', '));
  const list = element('div', undefined, 'paid-list');
  for (const [field, label, slot] of parts) {
    const piece = element('span');
    piece.style.flexGrow = String(paid[field]);
    piece.style.background = `var(${slot})`;
    bar.append(piece);
    const row = element('div', undefined, 'paid-row' + (field === 'cache_write_usd' ? ' lead' : ''));
    const key = element('i');
    key.style.setProperty('--swatch', `var(${slot})`);
    row.append(key, element('span', label, 'paid-name'), element('b', money(paid[field])), element('em', shareText(paid[field] / paid.total)));
    row.append(element('span', PAID_FOR_LINES[field], 'paid-means'));
    if (before) row.append(element('span', `${shareText(before[field] / before.total)} in ${shortPrevious(view)}`, 'paid-before'));
    list.append(row);
  }
  card.append(bar, list);
  return card;
}

function changeText(now, before) {
  if (before > 0) return multiple(now / before);
  return now > 0 ? 'new' : '';
}

function staticBreakdown(title, rows, level, mix, previous) {
  const card = element('section', undefined, 'card');
  const head = element('div', undefined, 'card-head');
  head.append(element('h2', title));
  if (previous) head.append(element('span', `Change compares with ${previous.label}${previous.label.startsWith('the ') ? ` (${previous.dates})` : ''}`, 'hint'));
  card.append(head, mixLegend());
  const total = cost(rows);
  const wrapper = element('div', undefined, 'table');
  const table = element('table');
  const widths = previous ? ['30%', '16%', '11%', '9%', '9%', '10%', '15%'] : ['36%', '19%', '11%', '9%', '11%', '14%'];
  const group = element('colgroup');
  for (const width of widths) {
    const column = element('col');
    column.style.width = width;
    group.append(column);
  }
  table.append(group);
  const header = table.createTHead().insertRow();
  for (const name of [LEVEL_NAMES[level], 'Share', 'Cost', ...(previous ? ['Change'] : []), 'Sessions', 'Per session', 'Paid for']) header.append(element('th', name));
  const body = table.createTBody();
  const {major, tail} = foldSmallRows(rows, row => row.cost_usd);
  const shownRows = [...major];
  if (tail.length) {
    const tailMix = foldMix(tail, mix);
    shownRows.push({label: `Others (${tail.length})`, key: 'folded tail', cost_usd: cost(tail), folded: true, before: tail.reduce((sum, row) => sum + (previous?.costs.get(rowId(row)) ?? 0), 0)});
    mix.set('folded tail', tailMix);
  }
  for (const row of shownRows) {
    const line = body.insertRow();
    line.append(nameCell(row.folded ? row.label : rowName(row, level)));
    const rowMix = mix.get(rowId(row));
    line.append(shareCell(total > 0 ? (row.cost_usd ?? 0) / total : 0));
    line.append(element('td', row.cost_usd == null ? 'no price' : dollars(row.cost_usd)));
    if (previous) line.append(element('td', changeText(row.cost_usd ?? 0, row.folded ? row.before : previous.costs.get(rowId(row)) ?? 0)));
    const count = rowMix?.sessions ?? 0;
    line.append(element('td', count ? count.toLocaleString() : ''), element('td', perSession(row, rowMix)), mixCell(rowMix));
  }
  const foot = table.createTFoot().insertRow();
  foot.append(element('td', 'Total'), element('td', ''), element('td', dollars(total)));
  if (previous) foot.append(element('td', changeText(total, [...previous.costs.values()].reduce((sum, value) => sum + value, 0))));
  foot.append(element('td', ''), element('td', ''), element('td', ''));
  wrapper.append(table);
  card.append(wrapper);
  return card;
}

function whoDidTheWork(rows, interactive) {
  const card = element('section', undefined, 'card');
  card.id = 'who';
  const head = element('div', undefined, 'card-head');
  const title = element('div', undefined, 'title');
  title.append(element('h2', 'Who did the work'), element('span', 'Your own conversation and each subagent, by the model it ran on', 'hint'));
  head.append(title);
  card.append(head);
  if (!rows.length) {
    card.append(element('p', 'No spend in this range.', 'note'));
    return card;
  }
  const modelTotals = new Map();
  const agents = new Map();
  for (const row of rows) {
    modelTotals.set(row.model, (modelTotals.get(row.model) || 0) + row.cost_usd);
    const id = (row.not_in_transcript ? 'u:' : '') + (row.agent_key ?? row.agent);
    if (!agents.has(id)) agents.set(id, {label: row.not_in_transcript && !row.agent_key ? NOT_IN_TRANSCRIPTS : agentName(row.agent), key: row.agent_key ?? null, raw: row.agent, models: new Map(), total: 0});
    const agent = agents.get(id);
    agent.models.set(row.model, (agent.models.get(row.model) || 0) + row.cost_usd);
    agent.total += row.cost_usd;
  }
  const models = [...modelTotals.keys()].sort((a, b) => modelTotals.get(b) - modelTotals.get(a));
  const shown = models.slice(0, 3);
  const rest = models.slice(3);
  const total = [...agents.values()].reduce((sum, agent) => sum + agent.total, 0);
  const wrapper = element('div', undefined, 'table');
  const table = element('table');
  const group = element('colgroup');
  const modelColumns = shown.length + (rest.length ? 1 : 0);
  for (const width of ['34%', ...Array(modelColumns).fill(`${44 / modelColumns}%`), '12%', '10%']) {
    const column = element('col');
    column.style.width = width;
    group.append(column);
  }
  table.append(group);
  const header = table.createTHead().insertRow();
  header.append(element('th', 'Who'));
  for (const model of shown) header.append(element('th', prettyModel(model)));
  if (rest.length) header.append(element('th', 'Other models'));
  header.append(element('th', 'Total'), element('th', 'Share'));
  const body = table.createTBody();
  const whole = value => dollars(value, value > 0 && value < 1 ? 2 : 0);
  const cell = value => element('td', value >= 0.005 ? whole(value) : '–', value >= 0.005 ? '' : 'dim');
  const share = sum => element('td', shareText(total > 0 ? sum / total : 0), 'dim');
  const valueCells = (line, models, sum) => {
    for (const model of shown) line.append(cell(models.get(model) || 0));
    if (rest.length) line.append(cell(rest.reduce((acc, model) => acc + (models.get(model) || 0), 0)));
    line.append(element('td', whole(sum), 'strong'), share(sum));
  };
  const addRow = agent => {
    const line = body.insertRow();
    line.append(nameCell(agent.label));
    if (interactive && agent.key === null) clickable(line, openNotInTranscriptsPanel);
    else if (interactive && !scopedKinds().has('agent')) clickable(line, () => openRowPanel({key: agent.key, label: agent.raw}, 'agent'));
    valueCells(line, agent.models, agent.total);
  };
  const ordered = [...agents.values()].sort((a, b) => b.total - a.total);
  const {major, tail} = interactive ? foldRows(ordered) : foldSmallRows(ordered, agent => agent.total);
  const toggle = () => { expanded.has('who') ? expanded.delete('who') : expanded.add('who'); fill(); };
  const fill = () => {
    body.replaceChildren();
    const open = interactive && expanded.has('who');
    for (const agent of open ? ordered : major) addRow(agent);
    if (!tail.length) return;
    if (open) {
      foldRow(body, null, 'Show fewer', toggle).cells[0].colSpan = 3 + modelColumns;
      return;
    }
    const sum = tail.reduce((acc, agent) => acc + agent.total, 0);
    const line = foldRow(body, `Others (${tail.length})`, interactive ? 'Show' : null, toggle);
    for (let column = 0; column < modelColumns; column++) line.append(element('td'));
    line.append(element('td', whole(sum), 'dim'), share(sum));
  };
  fill();
  if (!interactive) {
    const foot = table.createTFoot().insertRow();
    foot.append(element('td', 'Total'));
    for (const model of shown) foot.append(element('td', whole(modelTotals.get(model))));
    if (rest.length) foot.append(element('td', whole(rest.reduce((sum, model) => sum + modelTotals.get(model), 0))));
    foot.append(element('td', whole(total)), element('td', ''));
  }
  wrapper.append(table);
  card.append(wrapper);
  return card;
}

function weekText(week) {
  return week.cost_per_run_usd === null ? `${shortDate(week.week)}: no runs` : `${shortDate(week.week)}: ${dollars(week.cost_per_run_usd)} a run, ${week.runs} run${week.runs === 1 ? '' : 's'}`;
}

function changeEffect(change) {
  if (change.effect === 'reversed') return `reversed ${shortDate(change.reversed_on)}`;
  return `${change.effect} ${dollars(change.monthly_usd, 0)} a month`;
}

function lowerFirst(text) {
  return text.charAt(0).toLowerCase() + text.slice(1);
}

function claudePrompt(row, isSubagent) {
  return `Use Gigawatts to explain why my "${row.name}" ${isSubagent ? 'subagent' : 'skill'} costs what it does, and propose edits to its file that would make it cheaper.`;
}

function showWeekTip(event, week) {
  tip.replaceChildren();
  const head = element('div', undefined, 'head');
  head.append(element('span', `Week of ${shortDate(week.week)}`), element('b', week.cost_per_run_usd === null ? 'no runs' : `${dollars(week.cost_per_run_usd)} a run`));
  tip.append(head, element('div', `${week.runs} run${week.runs === 1 ? '' : 's'}, ${dollars(week.cost_usd)} in all`));
  tip.style.display = 'block';
  const rect = event.currentTarget.getBoundingClientRect();
  tip.style.left = Math.max(8, Math.min(rect.left, window.innerWidth - tip.offsetWidth - 8)) + 'px';
  tip.style.top = Math.min(rect.bottom + 8, window.innerHeight - tip.offsetHeight - 8) + 'px';
}

function weeklyBars(row, markWeeks, splitWeek) {
  const max = Math.max(0, ...row.weeks.map(week => week.cost_per_run_usd ?? 0));
  const chart = element('div', undefined, 'week-chart');
  chart.setAttribute('role', 'img');
  chart.setAttribute('aria-label', `Cost per run by week. ${row.weeks.map(weekText).join('. ')}`);
  const top = element('div', undefined, 'week-top');
  top.append(element('span', dollars(max)), element('span', 'a run'));
  const cols = element('div', undefined, 'week-cols');
  cols.style.setProperty('--weeks', row.weeks.length);
  const changed = new Set(markWeeks);
  for (const week of row.weeks) {
    const col = element('div', undefined, 'week-col');
    col.tabIndex = 0;
    const plot = element('div', undefined, 'week-plot');
    const height = max && week.cost_per_run_usd ? week.cost_per_run_usd / max * 100 : 0;
    if (height) {
      const bar = element('span', undefined, splitWeek && week.week < splitWeek ? 'week-bar before' : 'week-bar');
      bar.style.height = Math.max(height, 2) + '%';
      plot.append(bar);
    }
    if (changed.has(week.week)) {
      const dot = element('span', undefined, 'week-shift');
      dot.style.bottom = height + '%';
      plot.append(dot);
    }
    col.append(plot, element('span', shortDate(week.week)), element('span', week.runs.toLocaleString()));
    col.addEventListener('mouseenter', event => showWeekTip(event, week));
    col.addEventListener('focus', event => showWeekTip(event, week));
    col.addEventListener('mouseleave', hideTip);
    col.addEventListener('blur', hideTip);
    cols.append(col);
  }
  chart.append(top, cols, element('p', 'Under each date, that week\'s runs.', 'week-note'));
  return chart;
}

function changeBlock(change) {
  const block = element('div', undefined, 'change-block');
  const head = element('div', undefined, 'takeaway-head');
  head.append(element('b', `${shortDate(change.week)} · ${change.cause}`), element('span', changeEffect(change), 'dim'));
  const moved = change.shared_with.length ? ` The same change moved ${change.shared_with.join(', ')}.` : '';
  block.append(head, element('p', `${dollars(change.before_cost_per_run_usd)} → ${dollars(change.after_cost_per_run_usd)} a run, averaging the two weeks on each side.${moved}`));
  return block;
}

function insightsPanel(row, isSubagent, note) {
  panelShell(row.name, `${isSubagent ? 'Subagent' : 'Skill'} · last 8 weeks, every account`);
  const {facts, fact} = factList();
  fact('Cost', `${dollars(row.cost_usd)} over ${row.runs.toLocaleString()} run${row.runs === 1 ? '' : 's'}`);
  if (row.cost_per_run_usd !== null) fact('Per run', dollars(row.cost_per_run_usd));
  if (!isSubagent && row.cost_usd > 0) fact('Subagents', `${shareText(row.subagent_cost_usd / row.cost_usd)} of its cost`);
  if (row.facts?.runs_per_session) fact('Runs a session', row.facts.runs_per_session.toFixed(1));
  if (row.facts && row.cost_usd > 0) fact('Repeat runs', `${dollars(row.facts.repeat_run_cost_usd)}, ${shareText(row.facts.repeat_run_cost_usd / row.cost_usd)} of its cost`);
  if (row.facts?.top_tenth_session_share != null) fact('Costliest tenth', `${shareText(row.facts.top_tenth_session_share)} of its cost`);
  if (isSubagent && row.first_request_cost_usd !== null) fact('First requests', dollars(row.first_request_cost_usd));
  panel.append(facts);
  panel.append(element('h3', 'Cost per run, week by week'));
  panel.append(weeklyBars(row, note.changes.map(change => change.week)));
  panel.append(element('h3', 'Takeaways'));
  const list = element('div', undefined, 'takeaways');
  for (const item of note.takeaways) {
    const entry = element('div', undefined, 'takeaway');
    const head = element('div', undefined, 'takeaway-head');
    head.append(element('b', item.title));
    if (item.monthly_usd !== null) head.append(element('span', `about ${dollars(item.monthly_usd, 0)} a month`, 'dim'));
    entry.append(head, element('p', item.detail));
    list.append(entry);
  }
  panel.append(list);
  if (note.changes.length) {
    panel.append(element('h3', 'Changes'));
    const changes = element('div', undefined, 'takeaways');
    for (const change of note.changes) changes.append(changeBlock(change));
    panel.append(changes);
  }
  if (row.facts?.launches.length) {
    panel.append(element('h3', 'Subagents it launches'));
    const {facts: launches, fact: launch} = factList();
    for (const entry of row.facts.launches) {
      launch(entry.agent, `${entry.per_run === null ? entry.launches : entry.per_run.toFixed(1) + ' a run'} · ${dollars(entry.cost_usd)}, first requests ${dollars(entry.first_request_cost_usd)}`);
    }
    panel.append(launches);
  }
  panel.append(element('h3', 'Ask Claude for edits'));
  const prompt = claudePrompt(row, isSubagent);
  panel.append(element('p', 'Gigawatts finds where the money goes; Claude reads your skill and agent files and proposes the edits. Paste this into Claude Code:', 'panel-text'));
  panel.append(element('p', prompt, 'prompt'));
  panelAction('Copy prompt', async event => {
    const button = event.currentTarget;
    try {
      await navigator.clipboard.writeText(prompt);
      button.textContent = 'Copied';
    } catch {
      button.textContent = "Couldn't copy";
    }
  });
}

function insightRows() {
  const {skills, agents, takeaways} = latest.insights;
  return [...(takeaways?.skills ?? []), ...(takeaways?.agents ?? [])]
    .map(note => [(note.subagent ? agents : skills).find(row => row.name === note.name), note])
    .filter(([row]) => row)
    .sort(([a, x], [b, y]) => (y.to_save_usd ?? -1) - (x.to_save_usd ?? -1) || b.cost_usd - a.cost_usd);
}

function eventEffect(event) {
  return event.effect === 'reversed' ? `reversed ${shortDate(event.reversed_on)}` : `${event.effect} ${dollars(event.monthly_usd, 0)} a month`;
}

function eventNextStep(event) {
  const names = event.rows.map(member => member.name).join(', ');
  if (event.effect === 'saving') return `Keep it. It saves about ${dollars(event.monthly_usd, 0)} a month against the weeks before it.`;
  if (event.effect === 'reversed') return `Set back ${shortDate(event.reversed_on)}, so there's nothing to do.`;
  if (event.cause === 'No model or effort change') return `Nothing in the model or effort explains it. Check edits to ${names} around ${shortDate(event.week)}.`;
  return `If this change wasn't on purpose, setting it back would save about ${dollars(event.monthly_usd, 0)} a month.`;
}

function memberChange(entry, week) {
  return entry?.[1].changes.find(change => change.week === week);
}

function eventPanel(event, ordered) {
  panelShell(event.cause, `${shortDate(event.week)} · last 8 weeks, every account`);
  const entries = event.rows.map(member => [member, ordered.find(([row, note]) => row.name === member.name && note.subagent === member.subagent)]);
  const {facts, fact} = factList();
  fact('Effect', eventEffect(event));
  fact('Moved', event.rows.map(member => member.name).join(', '));
  if (event.undid) fact('Undid', `${shortDate(event.undid.week)}: ${lowerFirst(event.undid.cause)}`);
  panel.append(facts);
  panel.append(element('p', eventNextStep(event), 'panel-text next-step'));
  panel.append(element('h3', 'Cost per run, week by week'));
  const marks = [event.week, event.undid?.week].filter(Boolean);
  const charts = element('div', undefined, 'takeaways');
  for (const [member, entry] of entries) {
    if (!entry) continue;
    const change = memberChange(entry, event.week);
    const block = element('div', undefined, 'event-chart');
    const head = element('div', undefined, 'takeaway-head');
    head.append(element('b', member.name), element('span', change ? `${dollars(change.before_cost_per_run_usd)} → ${dollars(change.after_cost_per_run_usd)} a run` : '', 'dim'));
    block.append(head, weeklyBars(entry[0], marks, event.week));
    charts.append(block);
  }
  charts.append(element('p', `Faded bars are the weeks before ${shortDate(event.week)}. ${event.undid ? `Dots mark ${shortDate(event.week)} and the ${shortDate(event.undid.week)} change it undid.` : `A dot marks ${shortDate(event.week)}.`} The figures beside each name average the two weeks on each side.`, 'note'));
  panel.append(charts);
  panel.append(element('h3', 'Open a row'));
  const links = element('div', undefined, 'insight-links');
  for (const [member, entry] of entries) {
    if (!entry) continue;
    const line = element('div', undefined, 'insight-link');
    line.append(element('span', member.name), element('span', member.subagent ? 'Subagent' : 'Skill', 'dim'));
    clickable(line, () => insightsPanel(entry[0], member.subagent, entry[1]));
    links.append(line);
  }
  panel.append(links);
}

const TODO_ROWS = 3;
const NO_CAUSE = 'No model or effort change';
let changeTab = 'suggestions';
const changeTabOpen = new Set();

function todoRow({what, why, amount, note, tone, onOpen}) {
  const line = element('div', undefined, 'todo-row');
  const text = element('div');
  text.append(what instanceof Node ? what : element('div', what, 'todo-what'));
  if (why) text.append(element('div', why, 'todo-why'));
  const figure = element('div', amount, 'todo-amount' + (tone ? ' ' + tone : ''));
  if (note) figure.append(element('small', note));
  line.append(text, figure);
  if (onOpen) clickable(line, onOpen);
  return line;
}

function todoList(card, tab, rows, footNote) {
  const open = changeTabOpen.has(tab);
  const list = element('div', undefined, 'todo');
  list.append(...(open ? rows : rows.slice(0, TODO_ROWS)));
  card.append(list);
  const more = rows.length > TODO_ROWS;
  if (!more && !footNote) return;
  const foot = element('div', undefined, 'tab-foot');
  if (more) {
    const toggle = element('button', open ? 'Show fewer' : `Show all ${rows.length}`, 'link-button');
    toggle.type = 'button';
    toggle.addEventListener('click', () => { open ? changeTabOpen.delete(tab) : changeTabOpen.add(tab); render(); });
    foot.append(toggle);
  }
  if (footNote) foot.append(element('span', footNote));
  card.append(foot);
}

function biggestTakeaway(note) {
  return note.takeaways.filter(item => item.monthly_usd !== null).sort((a, b) => b.monthly_usd - a.monthly_usd)[0] ?? null;
}

function perRun(weeks) {
  const runs = weeks.reduce((sum, week) => sum + week.runs, 0);
  return runs ? weeks.reduce((sum, week) => sum + week.cost_usd, 0) / runs : null;
}

function plural(name) {
  return name.endsWith('s') ? name : name + 's';
}

function suggestionText(row, note, takeaway) {
  const text = suggestionSentence(row, note, takeaway);
  if (!note.subagent || !text.what.startsWith(row.name)) return text;
  const what = element('div', row.name, 'todo-what');
  what.append(element('span', ' subagent', 'dim'), text.what.slice(row.name.length));
  return {...text, what};
}

function suggestionSentence(row, note, takeaway) {
  const name = row.name;
  const kind = note.subagent ? 'subagent' : 'skill';
  const recent = perRun(row.weeks.slice(-2));
  const runs = `${row.runs.toLocaleString()} run${row.runs === 1 ? '' : 's'}${recent === null ? '' : `, ${dollars(recent)} a run over the last 2 weeks`}`;
  const rise = /^Cost per run up (\d+%) since (.+?), (.+)$/.exec(takeaway.title);
  if (rise) {
    const [, change, date, cause] = rise;
    const why = cause === 'no model or effort change' ? `No model or effort change. Check the ${kind}'s edits around ${date}.` : `${capitalized(cause)} that week.`;
    return {what: `${name} costs ${change} more a run since ${date}`, why};
  }
  const launches = /^([\d.]+) (.+) launches a run$/.exec(takeaway.title);
  if (launches) return {what: `${name} launches ${launches[1]} ${plural(launches[2])} a run`, why: runs};
  const repeat = /^Repeat runs in the same session \((.+)\)$/.exec(takeaway.title);
  if (repeat) return {what: `${name} spends ${repeat[1]} on repeat runs in the same session`, why: runs};
  const launchedFirst = /^(.+)'s first requests are (.+) of its cost$/.exec(takeaway.title);
  if (launchedFirst) return {what: `${launchedFirst[1]} spends ${launchedFirst[2]} of its cost in ${name} on first requests`, why: `Check what ${name} hands it: a path or a slice instead of the whole input.`};
  const first = /^First requests are (.+) of its cost$/.exec(takeaway.title);
  if (first) return {what: `${name} spends ${first[1]} of its cost on first requests`, why: 'Check what the skills that launch it hand it: a path or a slice instead of the whole input.'};
  const tenth = /^Costliest tenth of sessions spent (.+)$/.exec(takeaway.title);
  if (tenth) return {what: `${name}'s costliest tenth of sessions spent ${tenth[1]}`, why: runs};
  return {what: `${name}: ${lowerFirst(takeaway.title)}`, why: takeaway.detail};
}

function suggestionRows(card, ordered) {
  const flagged = ordered.filter(([, note]) => note.to_save_usd !== null && biggestTakeaway(note));
  const quiet = ordered.length - flagged.length;
  const footNote = quiet ? `${quiet.toLocaleString()} more ran with nothing to flag` : null;
  if (!flagged.length) {
    card.append(element('p', ordered.length ? 'Nothing flagged in the last 8 weeks.' : 'No skill or subagent runs in the last 8 weeks.', 'note'));
    if (footNote) card.append(element('p', footNote, 'note'));
    return;
  }
  todoList(card, 'suggestions', flagged.map(([row, note]) => {
    const {what, why} = suggestionText(row, note, biggestTakeaway(note));
    return todoRow({what, why, amount: dollars(note.to_save_usd, 0), note: 'a month at stake', onOpen: () => insightsPanel(row, note.subagent, note)});
  }), footNote);
}

function joinNames(names) {
  return names.length < 3 ? names.join(' and ') : `${names.slice(0, -1).join(', ')}, and ${names.at(-1)}`;
}

function eventTitle(event) {
  const names = joinNames(event.rows.map(member => member.name));
  if (event.cause !== NO_CAUSE) return `${names} ${lowerFirst(event.cause)}`;
  return `${names} got ${event.effect === 'saving' ? 'cheaper' : 'more expensive'} with no model or effort change`;
}

function eventRow(event, ordered) {
  const why = `Week of ${shortDate(event.week)}${event.undid ? `, undoing ${shortDate(event.undid.week)}: ${lowerFirst(event.undid.cause)}` : ''}`;
  const open = () => eventPanel(event, ordered);
  if (event.effect === 'reversed') return todoRow({what: eventTitle(event), why, amount: `reversed ${shortDate(event.reversed_on)}`, tone: 'muted', onOpen: open});
  const saving = event.effect === 'saving';
  return todoRow({what: eventTitle(event), why, amount: dollars(event.monthly_usd, 0), note: saving ? 'a month saved' : 'a month more', tone: saving ? 'good' : '', onOpen: open});
}

function changeRows(card, events, ordered) {
  if (!events.length) {
    card.append(element('p', 'No change in cost per run of 30% or more in the last 8 weeks.', 'note'));
    return;
  }
  const total = effect => events.filter(event => event.effect === effect).reduce((sum, event) => sum + event.monthly_usd, 0);
  const totals = element('div', undefined, 'totals');
  for (const [label, value, tone] of [['Saved', total('saving'), 'good'], ['Added', total('costing'), '']]) {
    const box = element('div');
    const figure = element('b', dollars(value, 0), tone);
    figure.append(element('small', 'a month'));
    box.append(element('span', label), figure);
    totals.append(box);
  }
  card.append(totals);
  const bySize = [...events].sort((a, b) => (a.effect === 'reversed') - (b.effect === 'reversed') || b.monthly_usd - a.monthly_usd);
  todoList(card, 'changes', bySize.map(event => eventRow(event, ordered)), 'Against the two weeks before each change');
}

function adviceRecommendations(view) {
  const entries = forAccount(latest.advice.accounts);
  const merged = new Map();
  const labels = [];
  const spans = new Set();
  for (const entry of entries) {
    const period = entry.behaviors?.week ? ['week', entry.behaviors.week] : entry.behaviors?.day ? ['day', entry.behaviors.day] : null;
    const recommendations = period?.[1].recommendations ?? [];
    if (!recommendations.length) continue;
    spans.add(period[0]);
    const label = latest.now.accounts.find(account => account.account === entry.account)?.account_label ?? entry.account;
    labels.push({account: entry.account, label});
    for (const recommendation of recommendations) {
      const key = recommendation.key ?? recommendation.title;
      if (!merged.has(key)) merged.set(key, {title: recommendation.title ?? String(recommendation.key ?? '').replace(/_/g, ' '), detail: recommendation.detail, shares: new Map()});
      merged.get(key).shares.set(entry.account, recommendation.pct ?? 0);
    }
  }
  return {entries, labels, items: [...merged.values()], span: spans.size === 1 && spans.has('day') ? 'Today' : 'This week'};
}

function adviceRows(card, advice) {
  if (!advice.entries.length) {
    card.append(element('p', 'No advice saved today. The engine saves it hourly while Claude Code is active.', 'note'));
    return;
  }
  if (!advice.items.length) {
    card.append(element('p', 'Nothing flagged.', 'note'));
    return;
  }
  const several = state.account === ALL && latest.now.accounts.length > 1;
  todoList(card, 'advice', advice.items.map(item => todoRow({
    what: item.title,
    why: item.detail ? capitalized(item.detail) : null,
    amount: advice.labels.map(({account}) => item.shares.has(account) ? percent(item.shares.get(account)) : '–').join(' · '),
    note: several ? advice.labels.map(({label}) => label).join(' · ') : 'of usage',
  })), `Read ${ago(Math.max(...advice.entries.map(entry => entry.fetched_at_ms)))}`);
}

function whatToChange(view) {
  if (state.scope.length) return null;
  const showAdvice = view.last >= view.today;
  const advice = showAdvice ? adviceRecommendations(view) : null;
  const options = [['suggestions', 'Suggestions'], ...(showAdvice ? [['advice', 'Anthropic\'s advice']] : []), ['changes', 'Changes']];
  const tab = options.some(([value]) => value === changeTab) ? changeTab : 'suggestions';
  const subtitles = {
    suggestions: 'Last 8 weeks, all accounts',
    advice: `${advice?.span ?? 'This week'}, from /usage · shares overlap`,
    changes: 'Last 8 weeks, all accounts',
  };
  const card = element('section', undefined, 'card');
  card.setAttribute('aria-label', 'What to change');
  const head = element('div', undefined, 'card-head');
  const title = element('div', undefined, 'title');
  title.append(element('h2', 'What to change'), element('span', subtitles[tab], 'hint'));
  head.append(title, tabs(options, tab, picked => { changeTab = picked; render(); }, 'Show', 'tabs small'));
  card.append(head);
  if (tab === 'advice') {
    adviceRows(card, advice);
  } else if (!latest.insights) {
    card.append(element('p', insightsError ? `Can't load insights: ${insightsError}` : 'Loading insights…', insightsError ? 'note error' : 'note'));
  } else if (tab === 'changes') {
    changeRows(card, latest.insights.takeaways?.events ?? [], insightRows());
  } else {
    suggestionRows(card, insightRows());
  }
  return card;
}

function biggestSessions(view) {
  const card = element('section', undefined, 'card');
  const head = element('div', undefined, 'card-head');
  const title = element('div', undefined, 'title');
  title.append(element('h2', 'Biggest sessions'));

  head.append(title);
  card.append(head);
  if (!view.sessions.length) {
    card.append(element('p', 'No sessions with request detail in this range.', 'note'));
    return card;
  }
  const open = expanded.has('sessions');
  if (view.sessions.length > PAGE_SESSIONS) {
    const more = element('button', open ? 'Show fewer' : `Show ${view.sessions.length - PAGE_SESSIONS} more`, 'link-button');
    more.type = 'button';
    more.addEventListener('click', () => { open ? expanded.delete('sessions') : expanded.add('sessions'); render(); });
    head.append(more);
  }
  const shown = open ? view.sessions : view.sessions.slice(0, PAGE_SESSIONS);
  const where = session => session.branch ? `${session.repo} · ${session.branch}` : session.repo;
  const showWhere = new Set(shown.map(where)).size > 1;
  const total = cost(view.rows);
  const wrapper = element('div', undefined, 'table');
  const table = element('table', undefined, 'sessions');
  const group = element('colgroup');
  for (const width of showWhere ? ['50%', '34%', '7%', '9%'] : ['84%', '7%', '9%']) {
    const column = element('col');
    column.style.width = width;
    group.append(column);
  }
  table.append(group);
  const header = table.createTHead().insertRow();
  for (const name of ['Session', ...(showWhere ? ['Where'] : []), 'Share', 'Cost']) header.append(element('th', name, name === 'Where' ? 'where' : undefined));
  const body = table.createTBody();
  for (const session of shown) {
    const line = body.insertRow();
    line.className = 'session';
    line.append(nameCell(session.title ?? 'Untitled session', sessionMeta(session)));
    if (showWhere) {
      const place = element('td', where(session), 'dim where');
      place.title = where(session);
      line.append(place);
    }
    line.append(element('td', shareText(total > 0 ? session.cost_usd / total : 0), 'dim'));
    line.append(element('td', dollars(session.cost_usd, 0), 'strong'));
    clickable(line, () => openPanel(session));
  }
  wrapper.append(table);
  card.append(wrapper);
  if (!showWhere) card.append(element('p', `${shown.length > 1 ? 'All in' : 'In'} ${where(shown[0])}.`, 'note'));
  return card;
}

// Side panel

const panel = document.getElementById('panel');
const backdrop = document.getElementById('backdrop');
let panelOpener = null;

function panelShell(title, subtitle) {
  if (!panel.classList.contains('open')) panelOpener = document.activeElement;
  panelToken += 1;
  panel.replaceChildren();
  const head = element('div', undefined, 'panel-head');
  head.append(element('h2', title));
  const close = element('button', '✕', 'close');
  close.type = 'button';
  close.setAttribute('aria-label', 'Close');
  close.addEventListener('click', closePanel);
  head.append(close);
  panel.append(head);
  if (subtitle) panel.append(element('p', subtitle, 'note panel-sub'));
  panel.setAttribute('aria-label', title);
  panel.classList.add('open');
  panel.setAttribute('aria-hidden', 'false');
  backdrop.classList.add('open');
  close.focus();
  return panelToken;
}

function closePanel() {
  if (!panel.classList.contains('open')) return;
  panelToken += 1;
  panel.classList.remove('open');
  panel.setAttribute('aria-hidden', 'true');
  backdrop.classList.remove('open');
  panelOpener?.focus?.();
}

function panelAction(text, action) {
  const actions = element('div', undefined, 'actions');
  const button = element('button', text, 'button primary');
  button.type = 'button';
  button.addEventListener('click', action);
  actions.append(button);
  panel.append(actions);
}

function factList() {
  const facts = element('dl', undefined, 'facts');
  const fact = (name, value) => { if (value) facts.append(element('dt', name), element('dd', value)); };
  return {facts, fact};
}

function shareList(title, items, total) {
  const spent = items.filter(item => item.cost > 0);
  const hidden = spent.length > PANEL_ROWS + 1 ? spent.slice(PANEL_ROWS) : [];
  const hidesOther = hidden.some(item => item.color === 'var(--other)');
  const shown = hidden.length ? [...spent.slice(0, PANEL_ROWS), {label: hidesOther ? 'Other' : `Others (${hidden.length})`, cost: hidden.reduce((sum, item) => sum + item.cost, 0), color: 'var(--other)'}] : spent;
  if (!shown.length) return;
  panel.append(element('h3', title));
  const list = element('div', undefined, 'shares');
  for (const item of shown) {
    const row = element('div', undefined, 'row');
    const bar = element('span', undefined, 'share');
    const track = element('span', undefined, 'track');
    const fill = element('span');
    fill.style.width = Math.max(total > 0 ? item.cost / total * 100 : 0, 1) + '%';
    if (item.color) fill.style.setProperty('--swatch', item.color);
    track.append(fill);
    bar.append(track);
    const name = element('span', item.label);
    name.title = item.label;
    row.append(name, bar, element('b', dollars(item.cost)));
    list.append(row);
  }
  panel.append(list);
}

function sessionList(sessions) {
  if (!sessions.length) return;
  panel.append(element('h3', 'Biggest sessions'));
  const list = element('div', undefined, 'panel-sessions');
  for (const session of sessions) {
    const button = element('button');
    button.type = 'button';
    button.append(element('span', session.title ?? 'Untitled session', 'title'), element('b', dollars(session.cost_usd)), element('small', sessionMeta(session)));
    button.addEventListener('click', () => openPanel(session));
    list.append(button);
  }
  panel.append(list);
}

function dayBars(days, first, last) {
  const byDay = new Map();
  for (const entry of days) byDay.set(entry.day, (byDay.get(entry.day) || 0) + entry.cost_usd);
  const all = daysBetween(first, last);
  const values = all.map(day => byDay.get(day) || 0);
  const max = Math.max(...values, 0.01);
  const width = 392, height = 72, lower = 16;
  const slot = width / all.length;
  const barWidth = Math.min(10, Math.max(slot * 0.7, 1));
  const root = svg('svg', {viewBox: `0 0 ${width} ${height}`, role: 'img', 'aria-label': `Spend per day from ${shortDate(first)} to ${shortDate(last)}`, class: 'day-bars'});
  root.append(svg('line', {x1: 0, x2: width, y1: height - lower, y2: height - lower, stroke: 'var(--axis)', 'stroke-width': 1}));
  values.forEach((value, index) => {
    if (value <= 0) return;
    const barHeight = Math.max(1, value / max * (height - lower - 4));
    const bar = svg('rect', {x: index * slot + (slot - barWidth) / 2, y: height - lower - barHeight, width: barWidth, height: barHeight, fill: 'var(--accent)', rx: barWidth > 4 ? 1.5 : 0});
    const title = svg('title', {});
    title.textContent = `${shortDate(all[index])}: ${dollars(value)}`;
    bar.append(title);
    root.append(bar);
  });
  for (const [day, anchor, x] of [[first, 'start', 0], [last, 'end', width]]) {
    const label = svg('text', {x, y: height - 3, 'text-anchor': anchor});
    label.textContent = shortDate(day);
    root.append(label);
  }
  const box = element('div', undefined, 'chart panel-chart');
  box.append(root);
  return box;
}

const PAID_FOR_MEANS = {
  input_usd: 'Most of this is fresh input that was not cached.',
  output_usd: 'Most of this is output: what the model wrote, including thinking. A cheaper model or lower effort for this work cuts it.',
  cache_write_usd: 'Most of this is cache writes: context built from scratch when a session or subagent starts, or after the cache expires during a pause. Fewer subagent launches and cold restarts cut it.',
  cache_read_usd: 'Most of this is cache reads: a long context read again on every turn. Starting fresh with /clear when you switch tasks cuts it.',
};

function paidFor(rows) {
  const totals = {input_usd: 0, output_usd: 0, cache_write_usd: 0, cache_read_usd: 0};
  for (const row of rows) for (const field of Object.keys(totals)) totals[field] += row[field] ?? 0;
  const total = Object.values(totals).reduce((sum, value) => sum + value, 0);
  if (total <= 0) return;
  shareList('Paid for', MIX_PARTS.map(([field, label, slot]) => ({label, cost: totals[field], color: `var(${slot})`})), total);
  const largest = Object.keys(totals).reduce((best, field) => totals[field] > totals[best] ? field : best);
  panel.append(element('p', `${PAID_FOR_MEANS[largest]} Split at list price, so read it as proportions.`, 'note panel-paid'));
}

function loadingNote() {
  const note = element('p', 'Loading…', 'note');
  panel.append(note);
  return note;
}

function failed(note, error) {
  note.className = 'note error';
  note.textContent = `Can't load: ${error.message}`;
}

function splitQuery(params, by) {
  const query = new URLSearchParams(params);
  query.set('by', by);
  return '/api/data?' + query;
}

async function addressKey(item, label) {
  if (item.kind !== 'repo' || !label || label === item.key) return item.key;
  try {
    const repos = await fetchJson('/api/data?range=all&by=repo');
    const keys = new Set(repos.rows.filter(row => row.label === label).map(row => row.key));
    return keys.size === 1 && keys.has(item.key) ? label : item.key;
  } catch {
    return item.key;
  }
}

async function openRowPanel(row, level) {
  const kind = SCOPE_OF_LEVEL[level];
  const name = rowName(row, level);
  const item = {kind, key: row.key, label: kind === 'repo' ? row.label : scopeLabel(kind, row.key)};
  const token = panelShell(name, state.scope.length ? `${GROUP_NAMES[kind]} in ${scopeTitle()}` : GROUP_NAMES[kind]);
  panelAction(`Focus the page on ${name}`, async () => focusOn({...item, key: await addressKey(item, row.label)}));
  const note = loadingNote();
  const view = buildView();
  const withRow = params => scopeParams(params, [item]);
  const splits = NEXT[kind].filter(other => !scopedKinds().has(other) && other !== kind).slice(0, 3);
  const seriesQuery = withRow(rangeParams());
  seriesQuery.set('by', 'model');
  seriesQuery.set('top', '1');
  const sessionsQuery = withRow(rangeParams());
  sessionsQuery.set('limit', String(PANEL_SESSIONS));
  const previousQuery = view.previousLabel ? withRow(new URLSearchParams(latest.previous.params)) : null;
  try {
    const mixQuery = withRow(rangeParams());
    mixQuery.set('by', 'model');
    const [series, sessions, previous, mix, ...answers] = await Promise.all([
      fetchJson('/api/series?' + seriesQuery),
      fetchJson('/api/sessions?' + sessionsQuery),
      previousQuery ? fetchJson('/api/data?' + previousQuery) : null,
      fetchJson('/api/mix?' + mixQuery),
      ...splits.map(split => fetchJson(splitQuery(withRow(rangeParams()), split))),
    ]);
    if (token !== panelToken) return;
    note.remove();
    const days = forAccount(series.days);
    const spend = days.reduce((sum, day) => sum + day.cost_usd, 0);
    const viewTotal = cost(view.rows);
    const {facts, fact} = factList();
    fact('Cost', `${dollars(spend)} · ${view.period}`);
    if (viewTotal > 0) fact('Share', `${shareText(spend / viewTotal)} of ${state.scope.length ? scopeTitle() : 'all spend'} in this range`);
    if (previous) {
      const before = cost(forAccount(previous.rows));
      fact('Before', before > 0 ? `${multiple(spend / before)} vs ${view.previousLabel} (${money(before)})` : `Nothing in ${view.previousLabel}`);
    }
    const count = sessionCount(sessions);
    if (count) fact('Sessions', count.toLocaleString());
    panel.append(facts, element('h3', 'Per day'), dayBars(days, view.first, view.last));
    paidFor(forAccount(mix.rows));
    splits.forEach((split, index) => {
      const answer = answers[index];
      const rows = mergeRows(forAccount(answer.rows));
      shareList('By ' + GROUP_NAMES[split].toLowerCase(), rows.map(entry => ({label: rowName(entry, answer.level), cost: entry.cost_usd ?? 0})), spend);
    });
    sessionList(forAccount(sessions.sessions).slice(0, PANEL_SESSIONS));
  } catch (error) {
    if (token === panelToken) failed(note, error);
  }
}

async function openNotInTranscriptsPanel() {
  const view = buildView();
  const token = panelShell(NOT_IN_TRANSCRIPTS, state.scope.length ? scopeTitle() : view.accountLabel ?? 'All accounts');
  panel.append(element('p', 'Spend Claude Code billed for requests it never wrote to its session transcripts. Gigawatts compares the cost Claude Code records for each session and model with what the transcripts hold, and keeps the difference here so totals match what Claude Code reports.', 'panel-text'));
  panel.append(element('p', 'Which requests these were is unknown; they come from Claude Code itself, and a Haiku share suggests background calls. Each one\'s session, model, repo, and branch are known, so the repo, branch, and model breakdowns count it there. Its skill and subagent are not, so those breakdowns show it as its own row rather than guess.', 'panel-text'));
  const note = loadingNote();

  seriesQuery.set('by', 'model');
  seriesQuery.set('top', '20');
  try {
    const [models, series, previous, mix] = await Promise.all([
      fetchJson(byModel(scopeParams(rangeParams()))),
      fetchJson('/api/series?' + seriesQuery),
      view.previousLabel ? fetchJson(byModel(scopeParams(new URLSearchParams(latest.previous.params)))) : null,
      fetchJson('/api/mix?' + (() => { const params = scopeParams(rangeParams()); params.set('by', 'model'); return params; })()),
    ]);

    if (previous) {
      const before = cost(forAccount(previous.rows).filter(row => row.not_in_transcript));
      fact('Before', before > 0 ? `${multiple(spend / before)} vs ${view.previousLabel} (${money(before)})` : `Nothing in ${view.previousLabel}`);

    shareList('By model', missing.map(row => ({label: prettyModel(row.label), cost: row.cost_usd ?? 0})), spend);
  } catch (error) {
    if (token === panelToken) failed(note, error);
  }
}

async function openDayPanel(day, total, parts) {
  const view = buildView();
  const title = new Date(day + 'T00:00:00Z').toLocaleDateString(undefined, {weekday: 'long', month: 'long', day: 'numeric', year: 'numeric', timeZone: 'UTC'});
  const token = panelShell(title, state.scope.length ? scopeTitle() : view.accountLabel ?? 'All accounts');
  panelAction('Show just this day', () => {
    state.range = 'custom';
    state.since = day;
    state.until = day;
    navigate();
  });
  const byDay = new Map();
  for (const entry of view.series) byDay.set(entry.day, (byDay.get(entry.day) || 0) + entry.cost_usd);
  const active = [...byDay.values()].filter(value => value > 0);
  const average = active.length ? active.reduce((sum, value) => sum + value, 0) / active.length : 0;
  const {facts, fact} = factList();
  fact('Spend', dollars(total));
  if (average > 0 && active.length > 1) fact('Usual', `${multiple(total / average)} vs the average active day in this range (${money(average)})`);
  panel.append(facts);
  const chartBy = chartGrouping();
  const largestFirst = parts.map(([label, value, color]) => ({label, cost: value, color})).sort((a, b) => (a.color === 'var(--other)') - (b.color === 'var(--other)') || b.cost - a.cost);
  shareList('By ' + chartName(chartBy).toLowerCase(), largestFirst, total);
  const note = loadingNote();
  const dayParams = () => {
    const params = scopeParams(new URLSearchParams());
    params.set('since', day);
    params.set('until', day);
    return params;
  };
  const splits = groupings().filter(kind => kind !== chartBy).slice(0, 2);
  const sessionsQuery = dayParams();
  sessionsQuery.set('limit', String(PANEL_SESSIONS));
  const mixQuery = dayParams();
  mixQuery.set('by', 'model');
  try {
    const [sessions, mix, ...answers] = await Promise.all([
      fetchJson('/api/sessions?' + sessionsQuery),
      fetchJson('/api/mix?' + mixQuery),
      ...splits.map(split => fetchJson(splitQuery(dayParams(), split))),
    ]);
    if (token !== panelToken) return;
    note.remove();
    paidFor(forAccount(mix.rows));
    splits.forEach((split, index) => {
      const answer = answers[index];
      shareList('By ' + GROUP_NAMES[split].toLowerCase(), mergeRows(forAccount(answer.rows)).map(entry => ({label: rowName(entry, answer.level), cost: entry.cost_usd ?? 0})), total);
    });
    sessionList(forAccount(sessions.sessions).slice(0, PANEL_SESSIONS));
  } catch (error) {
    if (token === panelToken) failed(note, error);
  }
}

function openPanel(session) {
  panelShell(session.title ?? 'Untitled session', session.session);
  const {facts, fact} = factList();
  fact('Cost', `${dollars(session.cost_usd)} · ${session.cost_status === 'exact' ? 'matches Claude Code' : session.cost_status === 'adjusted' ? 'adjusted to Claude Code' : 'estimated'}`);
  fact('Where', session.branch ? `${session.repo} · ${session.branch}` : session.repo);
  if (session.first_ms) fact('When', `${new Date(session.first_ms).toLocaleString(undefined, {weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit'})} to ${new Date(session.last_ms).toLocaleString(undefined, {hour: 'numeric', minute: '2-digit'})}${localDay(new Date(session.first_ms)) !== localDay(new Date(session.last_ms)) ? ' ' + longDate(session.last_ms) : ''}`);
  fact('Active', session.active_minutes ? `${minutes(session.active_minutes)} (gaps over 10 min left out)` : null);
  fact('Requests', session.requests.toLocaleString());
  fact('Peak context', session.peak_context ? `${compact(session.peak_context)} tokens in your own conversation` : null);
  panel.append(facts);
  const shares = (title, list, name) => shareList(title, list.map(share => ({label: name(share.label), cost: share.share * session.cost_usd})), session.cost_usd);
  shares('Skills', session.skills, skillName);
  shares('Models', session.models, prettyModel);
  shares('Subagents', session.agents, agentName);
  panel.append(element('p', 'Numbers cover the selected range. Costs per skill, model, and subagent are the session cost split by each one\'s share.', 'note'));
}

backdrop.addEventListener('click', closePanel);
document.addEventListener('keydown', event => {
  if (event.key === 'Escape') { closePanel(); closeMenu(); }
});

// Theme

const THEMES = [['auto', 'Auto', 'Follows your system'], ['light', 'Light'], ['dark', 'Dark']];
const THEME_KEY = 'gigawatts-theme';
const themeButton = document.getElementById('theme-button');
const themeMenu = document.getElementById('theme-menu');

function drawTheme() {
  const current = document.documentElement.dataset.theme ?? 'auto';
  const [, name] = THEMES.find(([value]) => value === current);
  themeButton.replaceChildren(icon(current), element('span', name, 'value'), icon('caret', 'caret'));
  themeMenu.replaceChildren(...THEMES.map(([value, label, meta]) => menuItem({
    label,
    meta,
    checked: value === current,
    onPick: () => pickTheme(value),
  })));
}

function pickTheme(value) {
  if (value === 'auto') delete document.documentElement.dataset.theme;
  else document.documentElement.dataset.theme = value;
  try {
    if (value === 'auto') localStorage.removeItem(THEME_KEY);
    else localStorage.setItem(THEME_KEY, value);
  } catch {}
  drawTheme();
}

drawTheme();
setupPopover(themeButton, themeMenu);

// Export

const exportButton = document.getElementById('export');
const exportMenu = document.getElementById('export-menu');
const FOOTNOTE = 'Costs come from Claude Code\'s local transcripts, priced at list price unless Claude Code recorded the session\'s own cost. Credits and limits come from Claude Code\'s usage readings. This summary leaves out repo, branch, and session names, except a scope you focused on. Skill, subagent, and model names are shown as they are named. "Not in transcripts" is spend Claude Code billed for requests it did not write to its transcripts, so it has a model but no skill or subagent.';

function exportLabel(text) {
  exportButton.replaceChildren(icon('download'), element('span', text, 'value'));
}

exportLabel('Export');
setupPopover(exportButton, exportMenu);

const EXPORTS = {
  markdown: summary => download(fileName(summary, 'md'), markdown(summary), 'text/markdown'),
  pdf: summary => printSummary(summary),
};

for (const item of exportMenu.querySelectorAll('[data-export]')) {
  item.addEventListener('click', async () => {
    closeMenu();
    try {
      await EXPORTS[item.dataset.export](await summaryData());
    } catch (error) {
      exportLabel('Export failed');
      exportButton.title = error.message;
    }
    setTimeout(() => { exportLabel('Export'); exportButton.removeAttribute('title'); }, 2000);
  });
}

function slug(text) {
  return text.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
}

function fileName(summary, extension) {
  const {view} = summary;
  const pieces = ['gigawatts', slug(view.shareableLabel || 'all accounts'), state.scope.length ? slug(scopeTitle()) : null, view.first, 'to', view.last];
  return pieces.filter(Boolean).join('-') + '.' + extension;
}

function download(name, text, type) {
  const link = element('a');
  link.href = URL.createObjectURL(new Blob([text], {type: type + ';charset=utf-8'}));
  link.download = name;
  document.body.append(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(link.href), 1000);
}

async function summaryData() {
  const view = buildView();
  const taken = scopedKinds();
  const chartBy = taken.has('model') ? 'skill' : 'model';
  const tables = ['model', 'skill'].filter(kind => !taken.has(kind));
  const query = scopeParams(rangeParams());
  const by = (kind, top) => {
    const params = new URLSearchParams(query);
    params.set('by', kind);
    if (top) params.set('top', String(top));
    return params;
  };
  const before = kind => {
    const params = scopeParams(new URLSearchParams(latest.previous.params));
    params.set('by', kind);
    return fetchJson('/api/data?' + params);
  };
  const compare = Boolean(view.previousLabel);
  const [series, ...answers] = await Promise.all([
    fetchJson('/api/series?' + by(chartBy, 20)),
    ...tables.flatMap(kind => [fetchJson('/api/data?' + by(kind)), fetchJson('/api/mix?' + by(kind)), compare ? before(kind) : null]),
  ]);
  const breakdowns = tables.map((kind, index) => {
    const [data, mix, previous] = answers.slice(index * 3, index * 3 + 3);
    return {
      kind,
      level: data.level,
      rows: mergeRows(forAccount(data.rows)),
      mix: mergeMix(forAccount(mix.rows)),
      previous: previous ? {label: view.previousLabel, dates: latest.previous.dates, costs: new Map(mergeRows(forAccount(previous.rows)).map(row => [rowId(row), row.cost_usd ?? 0]))} : null,
    };
  });
  const title = ['Gigawatts', view.shareableLabel || 'All accounts', state.scope.length ? scopeTitle() : null].filter(Boolean).join(' · ');
  return {view, chartBy, series: forAccount(series.days), breakdowns, title, exportedAt: new Date()};
}

function exportedLine(summary) {
  return `${summary.view.period} · exported ${summary.exportedAt.toLocaleString(undefined, {month: 'short', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit'})}`;
}

function summaryCards(summary) {
  const {view} = summary;
  const cards = [summaryHeadline(view)];
  cards.push(spendChart(view, summary.chartBy, summary.series, false).card);
  for (const table of summary.breakdowns) cards.push(staticBreakdown('By ' + GROUP_NAMES[table.kind].toLowerCase(), table.rows, table.level, new Map(table.mix), table.previous));
  cards.push(whoDidTheWork(view.agents, false));
  return cards;
}

function cellText(cell) {
  const text = cell.textContent.replace(/\s+/g, ' ').trim();
  return text || cell.querySelector('[title]')?.title || '';
}

function markdownCell(text) {
  return text.replace(/\|/g, '\\|').replace(/\s+/g, ' ').trim();
}

function markdownTable(header, rows) {
  const line = cells => '| ' + cells.map(markdownCell).join(' | ') + ' |';
  return [line(header), line(header.map(() => '---')), ...rows.map(line)].join('\n');
}

function domTable(table) {
  const header = [...table.querySelectorAll('thead th')].map(cellText);
  const rows = [...table.querySelectorAll('tbody tr, tfoot tr')].map(row => [...row.cells].map(cellText));
  return markdownTable(header, rows);
}

function dailyColumns(summary) {
  const {order, labels} = seriesColors(summary.series);
  const days = daysBetween(summary.view.first, summary.view.last);
  const bucket = days.length > 92 ? day => day.slice(0, 7) : day => day;
  const buckets = new Map();
  for (const day of days) if (!buckets.has(bucket(day))) buckets.set(bucket(day), new Map());
  for (const entry of summary.series) {
    const values = buckets.get(bucket(entry.day));
    if (!values) continue;
    const id = order.includes(seriesId(entry)) ? seriesId(entry) : 'other';
    values.set(id, (values.get(id) || 0) + entry.cost_usd);
  }
  return {order, labels, buckets, unit: days.length > 92 ? 'Month' : 'Day'};
}

function markdown(summary) {
  const parts = [`# ${summary.title}`, exportedLine(summary)];
  for (const card of summaryCards(summary)) {
    if (card.classList.contains('account-line')) { parts.push(card.textContent); continue; }
    const heading = card.querySelector('h2')?.textContent;
    const sentence = card.querySelector('.summary')?.textContent;
    const tiles = [...card.querySelectorAll('.tile')];
    if (tiles.length) {
      if (sentence) parts.push(sentence);
      parts.push(markdownTable(['Number', 'Value', 'Detail'], tiles.map(tile => [
        tile.querySelector('.label').textContent,
        tile.querySelector('.value').textContent,
        [...tile.querySelectorAll('.sub')].map(sub => sub.textContent).join('; '),
      ])));
      continue;
    }
    if (card.querySelector('.chart')) {
      const {order, labels, buckets, unit} = dailyColumns(summary);
      parts.push(`## Spend per ${unit.toLowerCase()}, by ${GROUP_NAMES[summary.chartBy].toLowerCase()}`);
      const rows = [...buckets].map(([when, values]) => [when, dollars([...values.values()].reduce((sum, value) => sum + value, 0)), ...order.map(id => values.get(id) ? dollars(values.get(id)) : '')]);
      parts.push(markdownTable([unit, 'Total', ...order.map(id => labels.get(id) ?? 'Other')], rows));
      continue;
    }
    const table = card.querySelector('table');
    const note = card.querySelector('.card-head .hint')?.textContent;
    if (heading && table) parts.push(`## ${heading}`, ...(note?.startsWith('Change compares') ? [note + '.'] : []), domTable(table));
  }
  parts.push('"Paid for" splits each cost by token type at list price.', FOOTNOTE);
  return parts.join('\n\n') + '\n';
}

function printSummary(summary) {
  const container = element('main', undefined, 'exported');
  const top = element('div', undefined, 'topbar');
  top.append(element('h1', summary.title));
  container.append(top, element('p', exportedLine(summary), 'source'));
  const stack = element('div', undefined, 'stack');
  stack.append(...summaryCards(summary));
  container.append(stack, element('p', FOOTNOTE, 'footnote'));
  document.getElementById('print').replaceChildren(container);
  document.body.classList.add('printing');
  document.title = fileName(summary, 'pdf').replace(/\.pdf$/, '');
  window.print();
}

window.addEventListener('afterprint', () => {
  document.body.classList.remove('printing');
  document.getElementById('print').replaceChildren();
  document.title = 'Gigawatts report';
});

window.gigawattsSummary = async () => markdown(await summaryData());

// Loading

async function fetchJson(path) {
  const answer = await fetch(path);
  const body = await answer.json();
  if (!answer.ok) throw new Error(body.error);
  return body;
}

function loadInsights() {
  if (insightsAnswer || insightsRequest) return;
  insightsRequest = fetchJson('/api/insights').then(answer => {
    insightsAnswer = answer;
    insightsError = null;
    if (latest) latest.insights = answer;
  }, error => {
    insightsRequest = null;
    insightsError = error.message;
  }).then(() => {
    if (latest) render();
  });
}

function previousParams(data, first) {
  if (!first || (!data.since && state.range === 'all')) return null;
  let since, until, label;
  if (state.range === 'month' || state.range === 'lastmonth') {
    const before = lastMonthBounds(state.range === 'month' ? data.today : first);
    since = before.since;
    until = state.range === 'month' ? before.sameDay : before.until;
    label = state.range === 'month' ? `${shortDate(since)} to ${shortDate(until)}` : before.name;
  } else {
    const length = dayCount(first, data.until || data.today);
    since = addDays(first, -length);
    until = addDays(first, -1);
    label = `the ${length} days before`;
  }
  const params = new URLSearchParams();
  params.set('since', since);
  params.set('until', until);
  params.set('by', 'model');
  return {params, label, dates: `${shortDate(since)} to ${shortDate(until)}`};
}

function sessionCount(answer) {
  if (state.account === ALL) return answer.total;
  return answer.per_account.find(count => count.account === state.account)?.sessions ?? 0;
}

async function load() {
  writeState();
  loadedHash = location.hash;
  const content = document.getElementById('content');
  content.style.opacity = '0.55';
  breakdownRequest++;
  chartRequest++;
  const scoped = state.scope.length > 0;
  const by = breakdownGrouping();
  const chart = seriesBy(chartGrouping());
  const dataQuery = scopeParams(rangeParams());
  dataQuery.set('by', by);
  const seriesQuery = scopeParams(rangeParams());
  seriesQuery.set('by', chart);
  seriesQuery.set('top', '20');
  const sessionsQuery = scopeParams(rangeParams());
  sessionsQuery.set('limit', '10');
  const accountQuery = rangeParams();
  accountQuery.set('by', 'model');
  try {
    const [now, data, series, agents, month, sessions, history, accountData, advice, limits, limitsRecent] = await Promise.all([
      fetchJson('/api/now'),
      fetchJson('/api/data?' + dataQuery),
      fetchJson('/api/series?' + seriesQuery),
      fetchJson('/api/agents?' + scopeParams(rangeParams())),
      fetchJson('/api/series?range=month&by=model&top=1'),
      fetchJson('/api/sessions?' + sessionsQuery),
      fetchJson('/api/series?range=all&by=model&top=1'),
      scoped ? fetchJson('/api/data?' + accountQuery) : null,
      fetchJson('/api/advice'),
      fetchJson('/api/limits?' + rangeParams()),
      fetchJson('/api/limits?since=' + addDays(localDay(), -RECENT_LIMIT_DAYS)),
    ]);
    const last = data.until || data.today;
    const first = data.since || series.days.map(day => day.day).sort()[0] || last;
    const previous = previousParams(data, first);
    const previousData = previous ? await fetchJson('/api/data?' + scopeParams(new URLSearchParams(previous.params))) : null;
    latest = {now, data, series, seriesBy: chart, agents, month, sessions, history, first, last, previous, previousData, accountData, advice, limits, limitsRecent, insights: insightsAnswer, fetchedAt: new Date()};
    render();
    if (breakdownGrouping() !== by) loadBreakdown();
    if (seriesMissing()) loadChart();
    if (!scoped) loadInsights();
  } catch (error) {
    showLoadError(error);
  } finally {
    content.style.opacity = '';
  }
}

function showLoadError(error) {
  const source = document.getElementById('source');
  source.className = 'source error';
  source.textContent = `Can't load the report: ${error.message}`;
}

async function loadBreakdown() {
  const request = ++breakdownRequest;
  const query = scopeParams(rangeParams());
  query.set('by', breakdownGrouping());
  try {
    const data = await fetchJson('/api/data?' + query);
    if (request !== breakdownRequest || !latest) return;
    latest.data = data;
    render();
  } catch (error) {
    showLoadError(error);
  }
}

async function loadChart() {
  const request = ++chartRequest;
  const query = scopeParams(rangeParams());
  const by = seriesBy(chartGrouping());
  query.set('by', by);
  query.set('top', '20');
  try {
    const series = await fetchJson('/api/series?' + query);
    if (request !== chartRequest || !latest || by !== seriesBy(chartGrouping())) return;
    latest.series = series;
    latest.seriesBy = by;
    render();
  } catch (error) {
    showLoadError(error);
  }
}

function buildView() {
  const {now, data, series, agents, month, sessions, history, first, last, previous, previousData, accountData} = latest;
  const firstRecord = forAccount(history.days).map(day => day.day).sort()[0];
  const recordedFrom = firstRecord ? addDays(firstRecord, 1) : data.today;
  const monthByDay = new Map();
  for (const entry of forAccount(month.days)) monthByDay.set(entry.day, (monthByDay.get(entry.day) || 0) + entry.cost_usd);
  const accountNow = state.account === ALL ? null : now.accounts.find(account => account.account === state.account);
  const sameYear = first.slice(0, 4) === last.slice(0, 4);
  const period = `${shortDate(first)}${sameYear ? '' : ', ' + first.slice(0, 4)} to ${shortDate(last)}, ${last.slice(0, 4)}`;
  const covered = previous && recordedFrom <= previous.params.get('since');
  return {
    rows: mergeRows(forAccount(data.rows)),
    previousRows: previousData ? forAccount(previousData.rows) : [],
    previousLabel: covered ? previous.label : null,
    historyStart: previous && !covered ? recordedFrom : null,
    series: forAccount(series.days),
    month: [...monthByDay].map(([day, cost_usd]) => ({day, cost_usd})),
    now: accountNow,
    accountLabel: accountNow?.account_label ?? null,
    shareableLabel: accountNow ? accountNow.configured_label ?? 'Account' : null,
    accountRows: accountData ? forAccount(accountData.rows) : null,
    today: data.today,
    first, last, period,
    level: data.level,
    agents: forAccount(agents.rows),
    sessions: forAccount(sessions.sessions).slice(0, 10),
    sessionCount: sessionCount(sessions),
    keptFrom: sessions.kept_from,
  };
}

function render() {
  if (!latest) return;
  const known = latest.now.accounts.map(account => account.account);
  if (!known.includes(state.account) && state.account !== ALL) {
    state.account = latest.now.accounts.find(account => slug(account.account_label ?? '') === state.account)?.account ?? defaultAccount(latest.now.accounts);
  }
  writeState();
  loadedHash = location.hash;
  const view = buildView();
  drawControls(latest.now.accounts, view);
  const source = document.getElementById('source');
  source.className = 'source';
  source.textContent = updatedLine(latest.fetchedAt);
  drawnWidth = chartWidth();
  const chart = spendChart(view, chartGrouping(), view.series, true);
  const sections = [];
  if (state.scope.length) {
    const line = accountLine(view);
    if (line) sections.push(line);
    sections.push(scopedHeadline(view));
  } else {
    sections.push(headline(view, false));
  }
  const changes = whatToChange(view);
  if (changes) sections.push(changes);
  sections.push(chart.card);
  const pair = element('div', undefined, 'pair');
  pair.append(breakdown(view), paidForCard(view));
  const who = whoDidTheWork(view.agents, true);
  const whoLeads = primaryScope() === 'model';
  sections.push(...(whoLeads ? [who, pair] : [pair]));
  sections.push(limitsCard(view));
  if (!whoLeads) sections.push(who);
  sections.push(biggestSessions(view));
  document.getElementById('content').replaceChildren(...sections);
  drawProblems();
}

function drawProblems() {
  const box = document.getElementById('problems');
  const problems = latest.data.problems.filter(problem => state.account === ALL || !problem.account || problem.account === state.account);
  box.hidden = problems.length === 0;
  if (!problems.length) return box.replaceChildren();
  const one = problems.length === 1;
  const list = element('ul');
  for (const problem of problems) {
    const item = element('li');
    const since = problem.since ? ` · since ${/^\d{4}-\d{2}-\d{2}/.test(problem.since) ? shortDate(problem.since.slice(0, 10)) : problem.since}` : '';
    item.append(element('div', capitalized(problem.affects) + since), element('div', capitalized(problem.cause), 'faint'));
    list.append(item);
  }
  const lead = element('span', `${one ? 'A problem with the data makes' : `${problems.length} problems with the data make`} some numbers here wrong. `, 'status-line warning');
  const command = element('span');
  command.append(element('code', 'gigawatts doctor'), ` says how to fix ${one ? 'it' : 'them'}.`);
  lead.append(command);
  box.replaceChildren(lead, list);
}

function capitalized(text) {
  return text.charAt(0).toUpperCase() + text.slice(1);
}

function onAddressChange() {
  if (location.hash === loadedHash) return;
  state = readState();
  expanded.clear();
  closePanel();
  load();
}

let resizeTimer = null;
let drawnWidth = null;
function onResize() {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    if (!latest || chartWidth() === drawnWidth) return;
    render();
  }, 150);
}

window.addEventListener('popstate', onAddressChange);
window.addEventListener('hashchange', onAddressChange);
window.addEventListener('resize', onResize);
load();
</script>
