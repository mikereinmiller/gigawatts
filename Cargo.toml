[package]
name = "gigawatts"
version = "0.1.51"
edition = "2024"
license = "MIT"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
libc = "0.2.191"
notify = "8.2"
ratatui = "0.30"
rusqlite = { version = "0.40", features = ["bundled"] }
rusqlite_migration = "2.6"
schemars = "1.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
toml_edit = "0.25.17"

[dev-dependencies]
insta = "1.49.0"
proptest = "1.12.0"
tempfile = "3.27.0"

[profile.dev.package.libsqlite3-sys]
opt-level = 3
